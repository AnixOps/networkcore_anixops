[workspace]
members = [
    "apps/linux-cli",
    "apps/windows-cli",
    "apps/windows-gui",
    "apps/windows-service",
    "crates/config-core",
    "crates/control-domain",
    "crates/control-runtime",
    "crates/engine-embedded",
    "crates/engine-native",
    "crates/engine-outbound",
    "crates/engine-mieru",
    "crates/engine-singbox",
    "crates/inbound-mixed",
    "crates/mitm-anixops-sys",
    "crates/mitm-policy",
    "crates/outbound-shadowsocks",
    "crates/outbound-vless",
    "crates/platform-ios",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/script-runtime",
    "crates/tls-mimic",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/AnixOps/networkcore_anixops"
