[workspace]
members = [
    "apps/anixcore",
    "apps/linux-cli",
    "apps/windows-cli",
    "crates/config-core",
    "crates/control-domain",
    "crates/control-runtime",
    "crates/engine-embedded",
    "crates/engine-inbound",
    "crates/engine-native",
    "crates/engine-outbound",
    "crates/inbound-hysteria2",
    "crates/inbound-iwan",
    "crates/inbound-mixed",
    "crates/inbound-shadowsocks",
    "crates/inbound-snell",
    "crates/inbound-transport",
    "crates/inbound-trojan",
    "crates/inbound-tuic",
    "crates/inbound-vless",
    "crates/inbound-vmess",
    "crates/mitm-anixops-sys",
    "crates/mitm-policy",
    "crates/node-import",
    "crates/node-runtime",
    "crates/outbound-http",
    "crates/outbound-hysteria2",
    "crates/outbound-iwan",
    "crates/outbound-mieru",
    "crates/outbound-shadowsocks",
    "crates/outbound-snell",
    "crates/outbound-socks",
    "crates/outbound-trojan",
    "crates/outbound-tuic",
    "crates/outbound-vless",
    "crates/outbound-vmess",
    "crates/platform-ios",
    "crates/platform-linux",
    "crates/platform-windows",
    "crates/script-runtime",
    "crates/tls-mimic",
    "crates/transport-tls",
    "crates/transport-grpc",
    "crates/transport-quic",
