[package]
name = "networkcore-linux-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Linux desktop client for AnixOps Net: the shared Tauri + React interface over the embedded engine."

# The window needs WebKitGTK, which plain workspace builds do not install, so the Tauri layer sits behind the
# `gui` feature. Without it the crate builds only the backend (state, engine control, system proxy, autostart),
# which the workspace jobs test; the Linux GUI job builds and lints the window with `--features gui`.
[features]
default = []
gui = ["dep:tauri", "dep:tauri-build", "dep:reqwest"]

[dependencies]
config-core = { path = "../../crates/config-core" }
control-domain = { path = "../../crates/control-domain" }
engine-embedded = { path = "../../crates/engine-embedded" }
inbound-mixed = { path = "../../crates/inbound-mixed" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"], optional = true }
tauri = { version = "2", optional = true }

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[lib]
path = "src/lib.rs"

[[bin]]
name = "anixops-net"
path = "src/main.rs"
