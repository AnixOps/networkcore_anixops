name: Refresh pnpm Lock

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  refresh:
    name: Generate pnpm lockfile artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate pnpm lockfile
        shell: bash
        run: pnpm --dir apps/windows-gui/ui install --lockfile-only --no-frozen-lockfile

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: apps/windows-gui/ui/pnpm-lock.yaml
          if-no-files-found: error
