name: Tunnel perf

# Packet-tunnel benchmark (crates/engine-embedded/examples/tunnel_bench.rs):
# kernel TCP -> TUN -> Tunnel -> outbound -> local server, the same code path as
# the iOS Network Extension. Pull requests run base and head on the same runner
# and the summary shows the change; the tunnel numbers are informational.
#
# Gates (the job fails when a target is missed):
# - rules: 10 000 routing rules, p99 of one decision under 50 us
#   (crates/config-core/examples/rule_bench.rs).

on:
  pull_request:
    paths:
      - crates/config-core/**
      - crates/engine-embedded/**
      - crates/engine-outbound/**
      - crates/netstack-smoltcp/**
      - crates/outbound-shadowsocks/**
      - Cargo.lock
      - .github/workflows/perf.yml
      - .github/scripts/perf-summary.py
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Commit, branch or tag to compare against (empty = head only)"
        type: string
        default: ""
      rounds:
        description: "Runs per side and outbound (median is reported)"
        type: string
        default: "2"
      window_kib:
        description: "TCP window of the userspace stack in KiB (runtime default 64)"
        type: string
        default: "64"
      profile:
        description: "Also record a perf CPU profile of the tunnel process (head only)"
        type: boolean
        default: false
      max_rule_p99_us:
        description: "Rule decision gate: p99 of one decision in microseconds"
        type: string
        default: "50"

permissions:
  contents: read

concurrency:
  group: perf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Routing decision latency with 10 000 rules (a gate). Pure CPU, a minute.
  rules:
    name: Rule decision benchmark (10k rules)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CARGO_INCREMENTAL: "0"
      MAX_RULE_P99_US: ${{ inputs.max_rule_p99_us || '50' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: false

      - name: Build
        run: cargo build --locked --release -p config-core --example rule_bench

      - name: Run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          target/release/examples/rule_bench --rules 10000 --queries 200000 --rounds 3 \
            --miss-share 0.1 --max-p99-us "${MAX_RULE_P99_US}" --json results/rules.json

      - name: Summary
        if: always()
        shell: bash
        run: python3 .github/scripts/perf-summary.py --rules results/rules.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rule-bench
          path: results
          retention-days: 14
          if-no-files-found: ignore

  bench:
    name: Tunnel benchmark (Linux TUN)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || inputs.base_ref }}
      ROUNDS: ${{ inputs.rounds || '2' }}
      WINDOW_KIB: ${{ inputs.window_kib || '64' }}
    steps:
      - name: Checkout head
        uses: actions/checkout@v7
        with:
          path: head
          submodules: true

      - name: Checkout base
        if: env.BASE_REF != ''
        uses: actions/checkout@v7
        with:
          path: base
          ref: ${{ env.BASE_REF }}
          submodules: true

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            head -> target
            base -> target
          save-if: false

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          for side in head base; do
            [ -d "${side}" ] || continue
            if [ ! -f "${side}/crates/engine-embedded/examples/tunnel_bench.rs" ]; then
              echo "::notice::${side} has no tunnel_bench; comparing head only"
              rm -rf "${side}"
              continue
            fi
            (cd "${side}" && cargo build --locked --release -p engine-embedded --example tunnel_bench)
          done

      - name: Create TUN device
        shell: bash
        run: |
          set -euo pipefail
          sudo ip tuntap add dev ncb0 mode tun user "$(id -u)"
          sudo ip addr add 198.18.0.1/16 dev ncb0
          sudo ip link set ncb0 mtu 1500 up
          ip addr show ncb0
          nproc
          lscpu | grep -E 'Model name|^CPU\(s\)' || true

      - name: Run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p results
          for round in $(seq 1 "${ROUNDS}"); do
            for side in base head; do
              [ -d "${side}" ] || continue
              for outbound in redirect ss2022; do
                echo "::group::${side} ${outbound} round ${round}"
                "${side}/target/release/examples/tunnel_bench" run --tun ncb0 \
                  --outbound "${outbound}" --window-kib "${WINDOW_KIB}" \
                  --json "results/${side}-${outbound}-${round}.json"
                echo "::endgroup::"
              done
            done
          done

      - name: Summary
        if: always()
        shell: bash
        run: python3 head/.github/scripts/perf-summary.py results >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-perf
          path: results
          if-no-files-found: ignore

  # CPU profile of the tunnel process (head only), on demand: where the
  # userspace stack spends its time per flow. The report is a text summary in
  # the job summary plus perf.data for offline use.
  profile:
    name: Tunnel CPU profile (Linux TUN)
    if: github.event_name == 'workflow_dispatch' && inputs.profile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_RELEASE_DEBUG: "line-tables-only"
      RUSTFLAGS: "-C force-frame-pointers=yes"
      WINDOW_KIB: ${{ inputs.window_kib || '64' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install perf
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -q
          sudo apt-get install -y -q "linux-tools-$(uname -r)" linux-tools-common \
            || sudo apt-get install -y -q linux-tools-generic linux-tools-common
          sudo sysctl -w kernel.perf_event_paranoid=-1 kernel.kptr_restrict=0
          perf --version

      - name: Build
        run: cargo build --locked --release -p engine-embedded --example tunnel_bench

      - name: Create TUN device
        shell: bash
        run: |
          set -euo pipefail
          sudo ip tuntap add dev ncb0 mode tun user "$(id -u)"
          sudo ip addr add 198.18.0.1/16 dev ncb0
          sudo ip link set ncb0 mtu 1500 up

      - name: Profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profile
          for outbound in redirect ss2022; do
            echo "::group::${outbound}"
            target/release/examples/tunnel_bench run --tun ncb0 \
              --outbound "${outbound}" --window-kib "${WINDOW_KIB}" \
              --json "profile/${outbound}.json" &
            bench=$!
            pid=""
            for _ in $(seq 1 100); do
              pid="$(pgrep -f 'tunnel_bench tunnel' | head -n1 || true)"
              [ -n "${pid}" ] && break
              sleep 0.1
            done
            if [ -z "${pid}" ]; then
              echo "::error::tunnel process not found"
              exit 1
            fi
            perf record -F 999 -g -p "${pid}" -o "profile/${outbound}.data" &
            recorder=$!
            wait "${bench}"
            kill -INT "${recorder}" 2>/dev/null || true
            wait "${recorder}" || true
            echo "::endgroup::"
          done

      - name: Summary
        if: always()
        shell: bash
        run: |
          set +e +o pipefail
          cp target/release/examples/tunnel_bench profile/ 2>/dev/null
          report() {
            perf report -i "$1" --stdio --no-children -g none --percent-limit "$2" "${@:3}" 2>&1 \
              | grep -v '^#' | grep -v '^$' | head -n 60
          }
          {
            echo "### Tunnel CPU profile"
            for outbound in redirect ss2022; do
              data="profile/${outbound}.data"
              [ -f "${data}" ] || continue
              echo
              echo "#### Outbound \`${outbound}\`: self time by thread and symbol"
              echo
              echo '```'
              report "${data}" 0.7 --sort comm,symbol
              echo '```'
              echo
              echo "#### Outbound \`${outbound}\`: self time by thread"
              echo
              echo '```'
              report "${data}" 0.5 --sort comm
              echo '```'
            done
          } > profile/summary.md
          cat profile/summary.md
          cat profile/summary.md >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Upload profile
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-profile
          path: profile
          if-no-files-found: ignore
