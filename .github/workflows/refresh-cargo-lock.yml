name: Refresh Cargo Lock

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "full regenerates every entry; add-missing only resolves new dependencies and keeps existing pins"
        type: choice
        options:
          - full
          - add-missing
        default: full

permissions:
  contents: read

jobs:
  refresh:
    name: Generate lockfile artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Generate Cargo.lock
        shell: bash
        env:
          LOCK_STRATEGY: ${{ inputs.strategy }}
        run: |
          set -euo pipefail
          if [ "${LOCK_STRATEGY}" = "add-missing" ]; then
            # Resolving metadata without --locked adds new dependencies to the
            # checked-in lockfile and leaves every existing pin unchanged.
            cargo metadata --format-version=1 > /dev/null
          else
            cargo generate-lockfile
          fi
          git diff --stat -- Cargo.lock

      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: cargo-lock
          path: Cargo.lock
          if-no-files-found: error
