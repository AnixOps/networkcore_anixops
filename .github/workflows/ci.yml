          grep -q "P4 backlog buckets" docs/ci-cd-policy.md
          grep -q "当前 main 源码状态" README.md
          grep -q "当前最新用户可下载 Linux artifact" TODO.md
          grep -Fq '当前最新已发布 Linux artifact 是 `v0.1.0`' docs/release-strategy.md
          grep -Fq "Alpha Release Feature Matrix" docs/ci-cd-policy.md
          grep -Fq "# Alpha Release Feature Matrix" docs/alpha-release-feature-matrix.md
          grep -Fq "v0.1.0-alpha.1" docs/alpha-release-feature-matrix.md
          grep -Fq "v0.1.0-alpha.2" docs/alpha-release-feature-matrix.md
          grep -Fq "v0.1.0-alpha.3" docs/alpha-release-feature-matrix.md
