          grep -q "THIRD_PARTY_PLUGIN_PERMISSION_GATE" docs/architecture/third-party-plugin-onboarding-process.md
          grep -q "THIRD_PARTY_PLUGIN_SAFE_WRAPPER_GATE" docs/architecture/third-party-plugin-onboarding-process.md
          grep -q "THIRD_PARTY_PLUGIN_CI_GOVERNANCE_GATE" docs/architecture/third-party-plugin-onboarding-process.md
          grep -q "THIRD_PARTY_PLUGIN_UPGRADE_PROCEDURE" docs/architecture/third-party-plugin-onboarding-process.md
          grep -q "third-party-plugin-onboarding-process.md" README.md
          grep -q "third-party plugin onboarding process" docs/ci-cd-policy.md
          grep -q "traffic-proof default proof binding" docs/ci-cd-policy.md
          grep -q -- "--proxy-scheme socks5" docs/ci-cd-policy.md
          grep -q "THIRD_PARTY_PLUGIN_SOURCE_CONTRACT" docs/architecture/mitm-policy-ad-block-plugin-source-contract.md

          release_workflow=.github/workflows/release.yml
          grep -q '^  package-linux:' "${release_workflow}"
          grep -q '^  attest-linux:' "${release_workflow}"
          grep -q '^  post-release-summary:' "${release_workflow}"
          grep -q '^  publish-eligibility-gate:' "${release_workflow}"
          grep -q '^  publish-github-release:' "${release_workflow}"
          grep -q '^  windows-cli-artifact-readiness:' "${release_workflow}"
          grep -q '^  package-windows:' "${release_workflow}"
          grep -q '^  attest-windows:' "${release_workflow}"
          grep -q '^  windows-release-summary:' "${release_workflow}"
          grep -q '^  windows-publish-eligibility-gate:' "${release_workflow}"
          grep -q 'actions/upload-artifact@v4' "${release_workflow}"
          grep -q 'actions/download-artifact@v4' "${release_workflow}"
          grep -q 'actions/attest@v4' "${release_workflow}"
          grep -q 'id-token: write' "${release_workflow}"
          grep -q 'attestations: write' "${release_workflow}"
          grep -q 'gh release create' "${release_workflow}"
          grep -Fq 'test -f Cargo.lock' "${release_workflow}"
          if grep -Fq 'cargo generate-lockfile' "${release_workflow}"; then
            echo "::error::Release artifacts must use the checked-in Cargo.lock; do not regenerate it in the release workflow."
            exit 1
          fi
          grep -Fq 'cargo build --locked --release --package "${PACKAGE}" --bin "${BINARY}" --target "${TARGET}"' "${release_workflow}"
          grep -Fq -- '--package networkcore-windows-gui `' "${release_workflow}"
          grep -Fq -- '--package networkcore-windows-service `' "${release_workflow}"
          grep -Fq 'wix build installer/windows/Package.wxs' "${release_workflow}"
          grep -Fq 'wix msi validate $archivePath' "${release_workflow}"
          grep -Fq 'script_runner_source="third_party/mitm_anixops/mitm_anixops/e2e/script_runtime/anixops_runner.js"' "${release_workflow}"
          grep -Fq 'libexec/anixops-runner.js' "${release_workflow}"
          grep -Fq 'top_level_dir="networkcore-linux-${version}-${target}"' "${release_workflow}"
          grep -Fq 'archive_name="${top_level_dir}.tar.gz"' "${release_workflow}"
          grep -Fq 'manifest_name="${top_level_dir}.manifest.json"' "${release_workflow}"
          grep -Fq '$artifactStem = "networkcore-windows-$version-$target"' "${release_workflow}"
          grep -Fq '$archiveName = "$artifactStem.msi"' "${release_workflow}"
          grep -Fq '$manifestName = "$artifactStem.manifest.json"' "${release_workflow}"
          grep -q 'linux-artifact-license-notice-status=confirmed' "${release_workflow}"
          grep -q 'package_publish_eligibility_status=eligible' "${release_workflow}"
          grep -q 'windows-release-assets' "${release_workflow}"
          grep -Fq "github.event_name == 'push' && github.ref_type == 'tag'" "${release_workflow}"

          grep -q '^linux-artifact-license-notice-source-contract=docs/architecture/linux-artifact-license-notice-confirmation.md$' docs/manual-intervention.md
          if grep -q '^linux-artifact-license-notice-status=confirmed$' docs/manual-intervention.md; then
            if grep -q '^linux-artifact-license-notice-status=pending$' docs/manual-intervention.md; then
              echo "::error::Linux artifact license/NOTICE cannot be pending and confirmed in the same marker block."
              exit 1
            fi
            grep -q '^linux-artifact-license-notice-transition-contract=docs/architecture/linux-package-license-notice-transition-validation-contract.md$' docs/manual-intervention.md
            grep -Eq '^linux-artifact-license-notice-confirmed-at=[0-9]{4}-[0-9]{2}-[0-9]{2}$' docs/manual-intervention.md
            grep -Eq '^linux-artifact-license-notice-confirmed-by=[A-Za-z0-9_.-]+$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-scope=networkcore-linux$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-license-source=LICENSE$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-notice-source=not-required$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-artifact-files=LICENSE$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-package-linux=eligible-after-ci-and-release-gates$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-release-assets=eligible-after-package-signing-checksum-and-rollback-gates$' docs/manual-intervention.md
          else
            grep -q '^linux-artifact-license-notice-status=pending$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-package-linux=blocked$' docs/manual-intervention.md
            grep -q '^linux-artifact-license-notice-release-assets=blocked$' docs/manual-intervention.md
          fi

          grep -q '^ios-upload-workflow-status=pending$' docs/manual-intervention.md
          grep -q '^ios-upload-workflow-release-assets=blocked$' docs/manual-intervention.md
          grep -q "iOS Source Tree Governance Placeholder" apps/ios/README.md
          if find . -path ./.git -prune -o \( -type f \( -name "Package.swift" -o -name "*.swift" -o -name "PrivacyInfo.xcprivacy" -o -name "*.entitlements" -o -name "*.mobileprovision" -o -name "*.provisionprofile" -o -name "*.p12" -o -name "*.cer" -o -name "*.key" -o -name "*.pem" -o -name "*.xcframework" -o -name "*.a" -o -name "ExportOptions.plist" -o -name "*.ipa" \) -o -type d \( -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "*.xcarchive" -o -name "*.xcresult" -o -name "*.dSYM" \) \) -print -quit | grep -q .; then
            echo "::error::iOS source, signing, archive/export, upload, or release material must stay out of the repository until the iOS contracts allow it."
            exit 1
          fi

          if find . -path ./.git -prune -o \( -path ./target -o -path ./dist \) -print -quit | grep -q .; then
            echo "::error::local build or package output directories must not be committed."
            exit 1
          fi

          echo "Repository policy passed."

  detect-projects:
    name: Detect project types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - policy-fast
    outputs:
      go: ${{ steps.detect.outputs.go }}
      rust: ${{ steps.detect.outputs.rust }}
      node: ${{ steps.detect.outputs.node }}
      swift: ${{ steps.detect.outputs.swift }}
      apple: ${{ steps.detect.outputs.apple }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect project manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_file() {
            find . -path ./.git -prune -o "$@" -print -quit | grep -q .
          }

          if has_file -name go.mod; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

          if has_file -name Cargo.toml; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

          if has_file -name package.json; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

          if has_file -name Package.swift; then
            echo "swift=true" >> "$GITHUB_OUTPUT"
          else
            echo "swift=false" >> "$GITHUB_OUTPUT"
          fi

          if has_file -name "*.xcodeproj" -o -name "*.xcworkspace"; then
            echo "apple=true" >> "$GITHUB_OUTPUT"
          else
            echo "apple=false" >> "$GITHUB_OUTPUT"
          fi

  workspace-smoke:
    name: Workspace smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs:
      - changes
      - policy-fast
    if: >-
      ${{
        needs.changes.outputs.full_matrix == 'true' ||
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.node == 'true' ||
        needs.changes.outputs.windows == 'true' ||
        needs.changes.outputs.linux == 'true' ||
        needs.changes.outputs.apple == 'true' ||
        needs.changes.outputs.ios == 'true'
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENT.md
          test -f LICENSE
          find . -maxdepth 3 -type f | sort | sed -n '1,160p'

  go-build-test:
    name: Go build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.go == 'true' &&
        (needs.changes.outputs.full_matrix == 'true' || needs.changes.outputs.go == 'true')
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            dir="$(dirname "$module")"
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path "*/vendor/*" | sort)

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            dir="$(dirname "$module")"
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path "*/vendor/*" | sort)

  windows-gui-frontend:
    name: Windows GUI frontend artifact
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.node == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.windows == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: pnpm --dir apps/windows-gui/ui install --no-frozen-lockfile

      - name: Build Windows GUI frontend
        shell: bash
        run: pnpm --dir apps/windows-gui/ui run build

      - name: Upload Windows GUI frontend
        uses: actions/upload-artifact@v4
        with:
          name: windows-gui-ui-${{ github.sha }}
          path: apps/windows-gui/ui/dist
          if-no-files-found: error
          retention-days: 1

  rust-build-test:
    name: Rust build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    needs:
      - changes
      - policy-fast
      - detect-projects
      - windows-gui-frontend
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.policy-fast.result == 'success' &&
        needs.detect-projects.result == 'success' &&
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.windows-gui-frontend.result == 'success' ||
          (needs.changes.outputs.full_matrix != 'true' && needs.changes.outputs.windows != 'true')
        ) &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download Windows GUI frontend
        if: runner.os == 'Windows' && needs.windows-gui-frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-gui-ui-${{ github.sha }}
          path: apps/windows-gui/ui/dist

      - name: Verify Windows GUI frontend
        if: runner.os == 'Windows' && needs.windows-gui-frontend.result == 'success'
        shell: bash
        run: test -s apps/windows-gui/ui/dist/index.html

      - name: Setup Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $MsysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "${{ github.workspace }}\.github\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_x86_64_pc_windows_gnu=${{ github.workspace }}\.github\scripts\rc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustup target add x86_64-pc-windows-gnu
          fi

      - name: Setup Node script runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build windres compatibility shim
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustc .github/scripts/windres_compat.rs -o .github/scripts/windres.exe
          rustc .github/scripts/rc_compat.rs -o .github/scripts/rc.exe

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Lint
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked --workspace --all-targets

      - name: Build
        shell: bash
        run: cargo build --locked --workspace --all-targets

  windows-managed-client-installer:
    name: Windows managed client MSI
    runs-on: windows-latest
    timeout-minutes: 45
    needs:
      - changes
      - policy-fast
      - detect-projects
      - windows-gui-frontend
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.policy-fast.result == 'success' &&
        needs.detect-projects.result == 'success' &&
        (needs.windows-gui-frontend.result == 'success' || needs.detect-projects.outputs.node != 'true') &&
        (needs.changes.outputs.full_matrix == 'true' || needs.changes.outputs.windows == 'true')
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Download Windows GUI frontend
        if: needs.windows-gui-frontend.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: windows-gui-ui-${{ github.sha }}
          path: apps/windows-gui/ui/dist

      - name: Verify Windows GUI frontend
        if: needs.windows-gui-frontend.result == 'success'
        shell: bash
        run: test -s apps/windows-gui/ui/dist/index.html

      - name: Setup Windows C toolchain
        uses: msys2/setup-msys2@v2
        id: windows-msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $MsysRoot = "${{ steps.windows-msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "${{ github.workspace }}\.github\scripts" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "RC_x86_64_pc_windows_gnu=${{ github.workspace }}\.github\scripts\rc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Build Windows binaries
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add x86_64-pc-windows-gnu
          rustc .github/scripts/windres_compat.rs -o .github/scripts/windres.exe
          rustc .github/scripts/rc_compat.rs -o .github/scripts/rc.exe
          cargo build --locked `
            --package networkcore-windows `
            --package networkcore-windows-gui `
            --package networkcore-windows-service `
            --target x86_64-pc-windows-gnu

      - name: Build and validate WiX MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          dotnet tool install --global wix --version 4.0.6
          wix extension add -g WixToolset.UI.wixext/4.0.6
          New-Item -ItemType Directory -Force -Path dist\windows-ci | Out-Null
          $releaseDir = (Resolve-Path "target\x86_64-pc-windows-gnu\debug").Path
          $defaultConfig = (Resolve-Path "installer\windows\default-managed-config.json").Path
          wix build installer/windows/Package.wxs `
            -ext WixToolset.UI.wixext `
            -arch x64 `
            -d "ProductVersion=0.2.1" `
            -d "CliExe=$releaseDir\networkcore-windows.exe" `
            -d "GuiExe=$releaseDir\networkcore-windows-gui.exe" `
            -d "ServiceExe=$releaseDir\networkcore-windows-service.exe" `
            -d "DefaultConfig=$defaultConfig" `
            -o dist\windows-ci\networkcore-windows-ci.msi
          wix msi validate dist\windows-ci\networkcore-windows-ci.msi
          if (-not (Test-Path dist\windows-ci\networkcore-windows-ci.msi -PathType Leaf)) {
            throw "Windows managed client MSI was not created."
          }
          if ((Get-Item dist\windows-ci\networkcore-windows-ci.msi).Length -le 0) {
            throw "Windows managed client MSI is empty."
          }

      - name: Install and uninstall Windows managed client MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $msiPath = (Resolve-Path "dist\windows-ci\networkcore-windows-ci.msi").Path
          $installLog = Join-Path $env:RUNNER_TEMP "networkcore-msi-install.log"
          $uninstallLog = Join-Path $env:RUNNER_TEMP "networkcore-msi-uninstall.log"

          function Invoke-MsiTransaction {
            param(
              [string[]]$Arguments,
              [string]$LogPath,
              [string]$Operation
            )

            $process = Start-Process -FilePath "msiexec.exe" -ArgumentList $Arguments -PassThru
            if (-not $process.WaitForExit(120000)) {
              Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $LogPath) {
                Get-Content $LogPath -Tail 200
              }
              throw "Windows managed client MSI $Operation exceeded 120 seconds."
            }
            if ($process.ExitCode -notin @(0, 3010)) {
              if (Test-Path $LogPath) {
                Get-Content $LogPath -Tail 200
              }
              throw "Windows managed client MSI $Operation failed with exit code $($process.ExitCode)."
            }
          }

          Invoke-MsiTransaction `
            -Arguments @("/i", "`"$msiPath`"", "/qn", "/norestart", "/l*v", "`"$installLog`"") `
            -LogPath $installLog `
            -Operation "install"

          $service = Get-Service -Name "AnixOpsNetworkCore" -ErrorAction SilentlyContinue
          if ($null -eq $service) {
            throw "Windows managed client MSI did not register AnixOpsNetworkCore."
          }

          $serviceExe = Join-Path $env:ProgramFiles "AnixOps\NetworkCore\networkcore-windows-service.exe"
          $guiExe = Join-Path $env:ProgramFiles "AnixOps\NetworkCore\networkcore-windows-gui.exe"
          $managedConfigPath = Join-Path $env:ProgramData "AnixOps\NetworkCore\managed-config.json"
          if (-not (Test-Path $serviceExe -PathType Leaf)) {
            throw "Windows managed client MSI did not install the service executable."
          }
          if (-not (Test-Path $managedConfigPath -PathType Leaf)) {
            throw "Windows managed client MSI did not install managed-config.json."
          }
          if (-not (Test-Path $guiExe -PathType Leaf)) {
            throw "Windows managed client MSI did not install the GUI executable."
          }

          $startupKey = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Run"
          New-Item -Path $startupKey -Force | Out-Null
          $startupCommand = "`"$guiExe`" --start-after-login"
          New-ItemProperty -Path $startupKey -Name "AnixOpsNetworkCore" -Value $startupCommand -PropertyType String -Force | Out-Null

          $service = Get-Service -Name "AnixOpsNetworkCore" -ErrorAction Stop
          if ($service.Status -ne "Stopped") {
            Stop-Service -Name "AnixOpsNetworkCore" -ErrorAction Stop
            $service.WaitForStatus("Stopped", [TimeSpan]::FromSeconds(30))
          }

          $originalManagedConfig = Get-Content -Path $managedConfigPath -Raw
          try {
            Set-Content -Path $managedConfigPath -Value "{ invalid managed configuration" -Encoding utf8
            $startOutput = Join-Path $env:RUNNER_TEMP "networkcore-service-start-invalid-config.out"
            $startError = Join-Path $env:RUNNER_TEMP "networkcore-service-start-invalid-config.err"
            $startProcess = Start-Process -FilePath $serviceExe -ArgumentList "start" -PassThru -RedirectStandardOutput $startOutput -RedirectStandardError $startError
            if (-not $startProcess.WaitForExit(10000)) {
              Stop-Process -Id $startProcess.Id -Force -ErrorAction SilentlyContinue
              if (Test-Path $startOutput) { Get-Content $startOutput }
              if (Test-Path $startError) { Get-Content $startError }
              throw "Windows service start waited for an invalid managed configuration."
            }
            if ($startProcess.ExitCode -ne 0) {
              if (Test-Path $startOutput) { Get-Content $startOutput }
              if (Test-Path $startError) { Get-Content $startError }
              throw "Windows service start request failed for an invalid managed configuration."
            }

            $deadline = [DateTime]::UtcNow.AddSeconds(15)
            do {
              $service = Get-Service -Name "AnixOpsNetworkCore" -ErrorAction Stop
              if ($service.Status -eq "Stopped") { break }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            if ($service.Status -ne "Stopped") {
              throw "Windows service did not report failure after invalid managed configuration."
            }
          } finally {
            Set-Content -Path $managedConfigPath -Value $originalManagedConfig -Encoding utf8
          }
          $serviceLog = Join-Path $env:ProgramData "AnixOps\NetworkCore\logs\service.log"
          if (-not (Test-Path $serviceLog -PathType Leaf)) {
            throw "Windows service did not write a startup diagnostic log."
          }
          if (-not (Select-String -Path $serviceLog -SimpleMatch "runtime start failed" -Quiet)) {
            throw "Windows service did not record the invalid managed configuration failure."
          }

          Invoke-MsiTransaction `
            -Arguments @("/x", "`"$msiPath`"", "/qn", "/norestart", "/l*v", "`"$uninstallLog`"") `
            -LogPath $uninstallLog `
            -Operation "uninstall"

          if ($null -ne (Get-Service -Name "AnixOpsNetworkCore" -ErrorAction SilentlyContinue)) {
            throw "Windows managed client MSI uninstall left AnixOpsNetworkCore registered."
          }
          if ($null -ne (Get-ItemProperty -Path $startupKey -Name "AnixOpsNetworkCore" -ErrorAction SilentlyContinue)) {
            throw "Windows managed client MSI uninstall left the current-user NetworkCore startup entry."
          }

  rust-security-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        shell: bash
        run: cargo install cargo-audit

      - name: Verify checked-in lockfile
        shell: bash
        run: cargo metadata --locked --offline --no-deps --format-version=1 > /dev/null

      - name: Audit dependencies
        shell: bash
        run: cargo audit

  node-build-test:
    name: Node build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.node == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.node == 'true' ||
          needs.changes.outputs.windows == 'true'
        )
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix:
        os:
          - ubuntu-latest
          - macos-26
          - windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/windows-gui/ui install --no-frozen-lockfile

      - name: Lint
        shell: bash
        run: pnpm --dir apps/windows-gui/ui run lint

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          pnpm --dir apps/windows-gui/ui test

  swift-build-test:
    name: Swift build and test
    runs-on: macos-26
    timeout-minutes: 45
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.swift == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.ios == 'true' ||
          needs.changes.outputs.apple == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Test
        shell: bash
        run: swift test

      - name: Build
        shell: bash
        run: swift build

  apple-project-smoke:
    name: Apple project smoke
    runs-on: macos-26
    timeout-minutes: 45
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.apple == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.ios == 'true' ||
          needs.changes.outputs.apple == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Inspect Xcode projects
        shell: bash
        run: |
          set -euo pipefail
          find . -maxdepth 4 \( -name "*.xcodeproj" -o -name "*.xcworkspace" \) -print

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - policy-fast
      - policy-full
      - detect-projects
      - workspace-smoke
      - go-build-test
      - windows-gui-frontend
      - rust-build-test
      - windows-managed-client-installer
      - rust-security-audit
      - node-build-test
      - swift-build-test
      - apple-project-smoke
    steps:
      - name: Check required jobs
        shell: bash
        env:
          CHANGE_GROUPS: ${{ needs.changes.outputs.groups }}
          CHANGE_SOURCE: ${{ needs.changes.outputs.change_source }}
          CHANGED_FILE_COUNT: ${{ needs.changes.outputs.changed_file_count }}
          CHANGE_DOCS: ${{ needs.changes.outputs.docs }}
          CHANGE_GOVERNANCE: ${{ needs.changes.outputs.governance }}
          CHANGE_GO: ${{ needs.changes.outputs.go }}
          CHANGE_RUST: ${{ needs.changes.outputs.rust }}
          CHANGE_NODE: ${{ needs.changes.outputs.node }}
          CHANGE_WINDOWS: ${{ needs.changes.outputs.windows }}
          CHANGE_LINUX: ${{ needs.changes.outputs.linux }}
          CHANGE_IOS: ${{ needs.changes.outputs.ios }}
          CHANGE_APPLE: ${{ needs.changes.outputs.apple }}
          CHANGE_WORKFLOW: ${{ needs.changes.outputs.workflow }}
          CHANGE_RELEASE_SENSITIVE: ${{ needs.changes.outputs.release_sensitive }}
          CHANGE_FULL_MATRIX: ${{ needs.changes.outputs.full_matrix }}
          CHANGE_UNKNOWN: ${{ needs.changes.outputs.unknown }}
          DETECTED_GO: ${{ needs.detect-projects.outputs.go }}
          DETECTED_RUST: ${{ needs.detect-projects.outputs.rust }}
          DETECTED_NODE: ${{ needs.detect-projects.outputs.node }}
          DETECTED_SWIFT: ${{ needs.detect-projects.outputs.swift }}
          DETECTED_APPLE: ${{ needs.detect-projects.outputs.apple }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_POLICY_FAST: ${{ needs.policy-fast.result }}
          RESULT_POLICY_FULL: ${{ needs.policy-full.result }}
          RESULT_DETECT_PROJECTS: ${{ needs.detect-projects.result }}
          RESULT_WORKSPACE_SMOKE: ${{ needs.workspace-smoke.result }}
          RESULT_GO_BUILD_TEST: ${{ needs.go-build-test.result }}
          RESULT_WINDOWS_GUI_FRONTEND: ${{ needs.windows-gui-frontend.result }}
          RESULT_RUST_BUILD_TEST: ${{ needs.rust-build-test.result }}
          RESULT_WINDOWS_INSTALLER: ${{ needs.windows-managed-client-installer.result }}
          RESULT_RUST_AUDIT: ${{ needs.rust-security-audit.result }}
          RESULT_NODE_BUILD_TEST: ${{ needs.node-build-test.result }}
          RESULT_SWIFT_BUILD_TEST: ${{ needs.swift-build-test.result }}
          RESULT_APPLE_SMOKE: ${{ needs.apple-project-smoke.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          workspace_required=false
          go_required=false
          windows_gui_frontend_required=false
          rust_required=false
          windows_required=false
          audit_required=false
          node_required=false
          swift_required=false
          apple_required=false

          if [[ "${CHANGE_FULL_MATRIX}" == true || "${CHANGE_GO}" == true || "${CHANGE_RUST}" == true ||
                "${CHANGE_NODE}" == true || "${CHANGE_WINDOWS}" == true || "${CHANGE_LINUX}" == true ||
                "${CHANGE_IOS}" == true || "${CHANGE_APPLE}" == true ]]; then
            workspace_required=true
          fi
          if [[ "${DETECTED_GO}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_GO}" == true) ]]; then
            go_required=true
          fi
          if [[ "${DETECTED_RUST}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_RUST}" == true ||
                "${CHANGE_WINDOWS}" == true || "${CHANGE_LINUX}" == true || "${CHANGE_IOS}" == true ||
                "${CHANGE_APPLE}" == true) ]]; then
            rust_required=true
            audit_required=true
          fi
          if [[ "${CHANGE_FULL_MATRIX}" == true || "${CHANGE_WINDOWS}" == true ]]; then
            windows_required=true
          fi
          if [[ "${DETECTED_NODE}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_WINDOWS}" == true) ]]; then
            windows_gui_frontend_required=true
          fi
          if [[ "${DETECTED_NODE}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_NODE}" == true ||
                "${CHANGE_WINDOWS}" == true) ]]; then
            node_required=true
          fi
          if [[ "${DETECTED_SWIFT}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_IOS}" == true ||
                "${CHANGE_APPLE}" == true) ]]; then
            swift_required=true
          fi
          if [[ "${DETECTED_APPLE}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_IOS}" == true ||
                "${CHANGE_APPLE}" == true) ]]; then
            apple_required=true
          fi

          ran_jobs=()
          skipped_jobs=()
          failed_jobs=()
          gate_failures=()

          record_job() {
            local name="$1"
            local result="$2"
            local expected="$3"

            case "${result}" in
              success)
                ran_jobs+=("${name}")
                ;;
              skipped)
                skipped_jobs+=("${name}")
                if [[ "${expected}" == true ]]; then
                  gate_failures+=("${name} was required but skipped")
                fi
                ;;
              failure)
                ran_jobs+=("${name}")
                failed_jobs+=("${name}")
                gate_failures+=("${name} failed")
                ;;
              cancelled)
                ran_jobs+=("${name}")
                failed_jobs+=("${name} (cancelled)")
                gate_failures+=("${name} was cancelled")
                ;;
              *)
                gate_failures+=("${name} returned unexpected result '${result}'")
                ;;
            esac
          }

          record_job "Detect changed paths" "${RESULT_CHANGES}" true
          record_job "Repository policy (fast)" "${RESULT_POLICY_FAST}" true
          record_job "Repository policy" "${RESULT_POLICY_FULL}" true
          record_job "Detect project types" "${RESULT_DETECT_PROJECTS}" true
          record_job "Workspace smoke" "${RESULT_WORKSPACE_SMOKE}" "${workspace_required}"
          record_job "Go build and test" "${RESULT_GO_BUILD_TEST}" "${go_required}"
          record_job "Windows GUI frontend artifact" "${RESULT_WINDOWS_GUI_FRONTEND}" "${windows_gui_frontend_required}"
          record_job "Rust build and test" "${RESULT_RUST_BUILD_TEST}" "${rust_required}"
          record_job "Windows managed client MSI" "${RESULT_WINDOWS_INSTALLER}" "${windows_required}"
          record_job "Rust dependency security audit" "${RESULT_RUST_AUDIT}" "${audit_required}"
          record_job "Node build and test" "${RESULT_NODE_BUILD_TEST}" "${node_required}"
          record_job "Swift build and test" "${RESULT_SWIFT_BUILD_TEST}" "${swift_required}"
          record_job "Apple project smoke" "${RESULT_APPLE_SMOKE}" "${apple_required}"

          join_list() {
            local joined
            if [[ "$#" -eq 0 ]]; then
              echo "none"
              return
            fi
            joined="$(IFS=', '; echo "$*")"
            echo "${joined}"
          }

          gate_conclusion=success
          next_action="No action required; this commit is eligible for downstream gates."
          if [[ "${#gate_failures[@]}" -gt 0 ]]; then
            gate_conclusion=failure
            next_action="Inspect only the failed or cancelled job steps, fix them, and rerun CI."
          fi

          {
            echo "### CI Summary"
            echo
            echo "| Run | Value |"
            echo "| --- | --- |"
            echo "| Commit SHA | ${{ github.sha }} |"
            echo "| Workflow run ID | ${{ github.run_id }} |"
            echo "| Workflow run | ${WORKFLOW_URL} |"
            echo "| Gate conclusion | ${gate_conclusion} |"
            echo "| Change source | ${CHANGE_SOURCE} |"
            echo "| Changed files | ${CHANGED_FILE_COUNT} |"
            echo "| Changed groups | ${CHANGE_GROUPS} |"
            echo "| Ran jobs | $(join_list "${ran_jobs[@]}") |"
            echo "| Skipped jobs | $(join_list "${skipped_jobs[@]}") |"
            echo "| Failed jobs | $(join_list "${failed_jobs[@]}") |"
            echo "| Next action | ${next_action} |"
            echo
            echo "| Path group | Changed |"
            echo "| --- | --- |"
            echo "| docs | ${CHANGE_DOCS} |"
            echo "| governance | ${CHANGE_GOVERNANCE} |"
            echo "| go | ${CHANGE_GO} |"
            echo "| rust | ${CHANGE_RUST} |"
            echo "| node | ${CHANGE_NODE} |"
            echo "| windows | ${CHANGE_WINDOWS} |"
            echo "| linux | ${CHANGE_LINUX} |"
            echo "| ios | ${CHANGE_IOS} |"
            echo "| apple | ${CHANGE_APPLE} |"
            echo "| workflow | ${CHANGE_WORKFLOW} |"
            echo "| release_sensitive | ${CHANGE_RELEASE_SENSITIVE} |"
            echo "| full_matrix | ${CHANGE_FULL_MATRIX} |"
            echo "| unknown | ${CHANGE_UNKNOWN} |"
            echo
            echo "| Job | Required | Result |"
            echo "| --- | --- | --- |"
            echo "| Detect changed paths | true | ${RESULT_CHANGES} |"
            echo "| Repository policy (fast) | true | ${RESULT_POLICY_FAST} |"
            echo "| Repository policy | true | ${RESULT_POLICY_FULL} |"
            echo "| Detect project types | true | ${RESULT_DETECT_PROJECTS} |"
            echo "| Workspace smoke | ${workspace_required} | ${RESULT_WORKSPACE_SMOKE} |"
            echo "| Go build and test | ${go_required} | ${RESULT_GO_BUILD_TEST} |"
            echo "| Windows GUI frontend artifact | ${windows_gui_frontend_required} | ${RESULT_WINDOWS_GUI_FRONTEND} |"
            echo "| Rust build and test | ${rust_required} | ${RESULT_RUST_BUILD_TEST} |"
            echo "| Windows managed client MSI | ${windows_required} | ${RESULT_WINDOWS_INSTALLER} |"
            echo "| Rust dependency security audit | ${audit_required} | ${RESULT_RUST_AUDIT} |"
            echo "| Node build and test | ${node_required} | ${RESULT_NODE_BUILD_TEST} |"
            echo "| Swift build and test | ${swift_required} | ${RESULT_SWIFT_BUILD_TEST} |"
            echo "| Apple project smoke | ${apple_required} | ${RESULT_APPLE_SMOKE} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "commit-sha=${{ github.sha }}"
          echo "workflow-run-id=${{ github.run_id }}"
          echo "workflow-run-url=${WORKFLOW_URL}"
          echo "changed-groups=${CHANGE_GROUPS}"
          echo "ran-jobs=$(join_list "${ran_jobs[@]}")"
          echo "skipped-jobs=$(join_list "${skipped_jobs[@]}")"
          echo "failed-jobs=$(join_list "${failed_jobs[@]}")"
          echo "ci-gate-conclusion=${gate_conclusion}"

          if [[ "${gate_conclusion}" != success ]]; then
            printf '::error::%s\n' "$(join_list "${gate_failures[@]}")"
            exit 1
          fi
