          grep -q "当前阶段是 P4 Client And Platform Integration" TODO.md
          grep -q "P4 backlog buckets" README.md
          grep -q "P4 backlog buckets" ROADMAP.md
          grep -q "P4 backlog buckets" TODO.md
          grep -q "P4 backlog buckets" CHANGELOG.md
          grep -q "P4 current stage source of truth" apps/linux-cli/README.md
