name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Superseded pull request runs are cancelled. Runs on main, tags and manual dispatch
# always finish so every merged commit has a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      governance: ${{ steps.changes.outputs.governance }}
      go: ${{ steps.changes.outputs.go }}
      rust: ${{ steps.changes.outputs.rust }}
      windows: ${{ steps.changes.outputs.windows }}
      linux: ${{ steps.changes.outputs.linux }}
      ios: ${{ steps.changes.outputs.ios }}
      apple: ${{ steps.changes.outputs.apple }}
      workflow: ${{ steps.changes.outputs.workflow }}
      release_sensitive: ${{ steps.changes.outputs.release_sensitive }}
      full_matrix: ${{ steps.changes.outputs.full_matrix }}
      unknown: ${{ steps.changes.outputs.unknown }}
      change_source: ${{ steps.changes.outputs.change_source }}
      changed_file_count: ${{ steps.changes.outputs.changed_file_count }}
      groups: ${{ steps.changes.outputs.groups }}
      validation_matrix: ${{ steps.changes.outputs.validation_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-ci-changes.sh

      - name: Summarize changed paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Changed Paths"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source | ${{ steps.changes.outputs.change_source }} |"
            echo "| Files | ${{ steps.changes.outputs.changed_file_count }} |"
            echo "| Groups | ${{ steps.changes.outputs.groups }} |"
            echo "| Full matrix | ${{ steps.changes.outputs.full_matrix }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  policy-fast:
    name: Repository policy (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify structured fast policy
        shell: bash
        run: bash .github/scripts/verify-repository-policy.sh fast

      - name: Verify change classifier contracts
        shell: bash
        run: |
          set -euo pipefail
          classifier="${GITHUB_WORKSPACE}/.github/scripts/detect-ci-changes.sh"
          fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT

          git -C "${fixture}" init --quiet
          git -C "${fixture}" config user.name ci-path-contract
          git -C "${fixture}" config user.email ci-path-contract@example.invalid
          echo seed > "${fixture}/seed.txt"
          git -C "${fixture}" add seed.txt
          git -C "${fixture}" commit --quiet -m seed

          classify_commit() {
            local base_sha="$1"
            local head_sha="$2"
            local output_file="$3"
            (
              cd "${fixture}"
              EVENT_NAME=push \
                REF_TYPE=branch \
                BASE_SHA="${base_sha}" \
                HEAD_SHA="${head_sha}" \
                GITHUB_OUTPUT="${output_file}" \
                RUNNER_TEMP="${fixture}" \
                bash "${classifier}"
            )
          }

          base_sha="$(git -C "${fixture}" rev-parse HEAD)"
          mkdir -p "${fixture}/docs"
          echo docs > "${fixture}/docs/guide.md"
          git -C "${fixture}" add docs/guide.md
          git -C "${fixture}" commit --quiet -m docs
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          docs_output="${fixture}/docs.output"
          classify_commit "${base_sha}" "${head_sha}" "${docs_output}"
          grep -qx 'docs=true' "${docs_output}"
          grep -qx 'full_matrix=false' "${docs_output}"

          base_sha="${head_sha}"
          echo lock > "${fixture}/Cargo.lock"
          git -C "${fixture}" add Cargo.lock
          git -C "${fixture}" commit --quiet -m lock
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          lock_output="${fixture}/lock.output"
          classify_commit "${base_sha}" "${head_sha}" "${lock_output}"
          grep -qx 'rust=true' "${lock_output}"
          grep -qx 'release_sensitive=true' "${lock_output}"
          grep -qx 'full_matrix=true' "${lock_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/crates/control-domain/src"
          echo shared > "${fixture}/crates/control-domain/src/lib.rs"
          git -C "${fixture}" add crates/control-domain/src/lib.rs
          git -C "${fixture}" commit --quiet -m shared-rust
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          shared_output="${fixture}/shared.output"
          classify_commit "${base_sha}" "${head_sha}" "${shared_output}"
          grep -qx 'rust=true' "${shared_output}"
          grep -qx 'full_matrix=true' "${shared_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/apps/windows-cli/src"
          echo windows > "${fixture}/apps/windows-cli/src/main.rs"
          git -C "${fixture}" add apps/windows-cli/src/main.rs
          git -C "${fixture}" commit --quiet -m windows
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          windows_output="${fixture}/windows.output"
          classify_commit "${base_sha}" "${head_sha}" "${windows_output}"
          grep -qx 'rust=true' "${windows_output}"
          grep -qx 'windows=true' "${windows_output}"
          grep -qx 'full_matrix=false' "${windows_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"windows-latest","timeout":45}]}' "${windows_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/docs/architecture"
          echo windows-docs > "${fixture}/docs/architecture/windows-ci-notes.md"
          git -C "${fixture}" add docs/architecture/windows-ci-notes.md
          git -C "${fixture}" commit --quiet -m windows-docs
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          windows_docs_output="${fixture}/windows-docs.output"
          classify_commit "${base_sha}" "${head_sha}" "${windows_docs_output}"
          grep -qx 'docs=true' "${windows_docs_output}"
          grep -qx 'windows=false' "${windows_docs_output}"
          grep -qx 'full_matrix=false' "${windows_docs_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"ubuntu-latest","timeout":30}]}' "${windows_docs_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/apps/linux-cli/src"
          echo linux > "${fixture}/apps/linux-cli/src/main.rs"
          git -C "${fixture}" add apps/linux-cli/src/main.rs
          git -C "${fixture}" commit --quiet -m linux
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          linux_output="${fixture}/linux.output"
          classify_commit "${base_sha}" "${head_sha}" "${linux_output}"
          grep -qx 'rust=true' "${linux_output}"
          grep -qx 'linux=true' "${linux_output}"
          grep -qx 'full_matrix=false' "${linux_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"ubuntu-latest","timeout":30}]}' "${linux_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/crates/platform-windows/src"
          echo windows-platform > "${fixture}/crates/platform-windows/src/lib.rs"
          git -C "${fixture}" add crates/platform-windows/src/lib.rs
          git -C "${fixture}" commit --quiet -m windows-platform
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          windows_platform_output="${fixture}/windows-platform.output"
          classify_commit "${base_sha}" "${head_sha}" "${windows_platform_output}"
          grep -qx 'rust=true' "${windows_platform_output}"
          grep -qx 'windows=true' "${windows_platform_output}"
          grep -qx 'full_matrix=false' "${windows_platform_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"windows-latest","timeout":45}]}' "${windows_platform_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/crates/platform-ios/src"
          echo apple > "${fixture}/crates/platform-ios/src/lib.rs"
          git -C "${fixture}" add crates/platform-ios/src/lib.rs
          git -C "${fixture}" commit --quiet -m apple
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          apple_output="${fixture}/apple.output"
          classify_commit "${base_sha}" "${head_sha}" "${apple_output}"
          grep -qx 'rust=true' "${apple_output}"
          grep -qx 'ios=true' "${apple_output}"
          grep -qx 'apple=true' "${apple_output}"
          grep -qx 'full_matrix=false' "${apple_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"macos-26","timeout":40}]}' "${apple_output}"

          base_sha="${head_sha}"
          echo unknown > "${fixture}/unknown.file"
          git -C "${fixture}" add unknown.file
          git -C "${fixture}" commit --quiet -m unknown
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          unknown_output="${fixture}/unknown.output"
          classify_commit "${base_sha}" "${head_sha}" "${unknown_output}"
          grep -qx 'unknown=true' "${unknown_output}"
          grep -qx 'full_matrix=true' "${unknown_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/.github/workflows"
          echo workflow > "${fixture}/.github/workflows/ci.yml"
          git -C "${fixture}" add .github/workflows/ci.yml
          git -C "${fixture}" commit --quiet -m workflow
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          workflow_output="${fixture}/workflow.output"
          classify_commit "${base_sha}" "${head_sha}" "${workflow_output}"
          grep -qx 'workflow=true' "${workflow_output}"
          grep -qx 'full_matrix=true' "${workflow_output}"

          dispatch_output="${fixture}/dispatch.output"
          (
            cd "${fixture}"
            EVENT_NAME=workflow_dispatch \
              REF_TYPE=branch \
              GITHUB_OUTPUT="${dispatch_output}" \
              RUNNER_TEMP="${fixture}" \
              bash "${classifier}"
          )
          grep -qx 'change_source=workflow_dispatch' "${dispatch_output}"
          grep -qx 'full_matrix=true' "${dispatch_output}"

          tag_output="${fixture}/tag.output"
          (
            cd "${fixture}"
            EVENT_NAME=push \
              REF_TYPE=tag \
              GITHUB_OUTPUT="${tag_output}" \
              RUNNER_TEMP="${fixture}" \
              bash "${classifier}"
          )
          grep -qx 'change_source=tag' "${tag_output}"
          grep -qx 'full_matrix=true' "${tag_output}"

  policy-full:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify structured full policy
        shell: bash
        run: bash .github/scripts/verify-repository-policy.sh full

  detect-projects:
    name: Detect project types
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
      - policy-fast
    outputs:
      go: ${{ steps.detect.outputs.go }}
      rust: ${{ steps.detect.outputs.rust }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect project manifests
        id: detect
        shell: bash
        run: |
          set -euo pipefail

          has_file() {
            find . -path ./.git -prune -o "$@" -print -quit | grep -q .
          }

          if has_file -name go.mod; then
            echo "go=true" >> "$GITHUB_OUTPUT"
          else
            echo "go=false" >> "$GITHUB_OUTPUT"
          fi

          if has_file -name Cargo.toml; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

          echo "Project detection is informational only; job execution is governed by changed paths."

  workspace-smoke:
    name: Workspace smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    needs:
      - changes
      - policy-fast
    if: >-
      ${{
        needs.changes.outputs.full_matrix == 'true' ||
        needs.changes.outputs.go == 'true' ||
        needs.changes.outputs.rust == 'true' ||
        needs.changes.outputs.windows == 'true' ||
        needs.changes.outputs.linux == 'true' ||
        needs.changes.outputs.apple == 'true' ||
        needs.changes.outputs.ios == 'true'
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify workspace
        shell: bash
        run: |
          set -euo pipefail
          test -f README.md
          test -f AGENT.md
          test -f LICENSE
          find . -maxdepth 3 -type f | sort | sed -n '1,160p'

  go-build-test:
    name: Go build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.go == 'true' &&
        (needs.changes.outputs.full_matrix == 'true' || needs.changes.outputs.go == 'true')
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            dir="$(dirname "$module")"
            echo "::group::go test $dir"
            (cd "$dir" && go test ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path "*/vendor/*" | sort)

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r module; do
            dir="$(dirname "$module")"
            echo "::group::go build $dir"
            (cd "$dir" && go build ./...)
            echo "::endgroup::"
          done < <(find . -name go.mod -not -path "*/vendor/*" | sort)

  rust-build-test:
    name: Rust build and test
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout }}
    env:
      CARGO_INCREMENTAL: "0"
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        always() &&
        needs.changes.result == 'success' &&
        needs.policy-fast.result == 'success' &&
        needs.detect-projects.result == 'success' &&
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    strategy:
      fail-fast: ${{ github.event_name == 'pull_request' }}
      matrix: ${{ fromJSON(needs.changes.outputs.validation_matrix) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Windows C toolchain
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        id: msys2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-binutils
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-libsystre

      - name: Configure Windows Rust GNU target
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $MsysRoot = "${{ steps.msys2.outputs.msys2-location }}"
          $MingwPrefix = Join-Path $MsysRoot "mingw64"
          "$MingwPrefix\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "MSYS2_LOCATION=$MsysRoot" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "MINGW_PREFIX=$MingwPrefix" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_BUILD_TARGET=x86_64-pc-windows-gnu" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CC_x86_64_pc_windows_gnu=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "AR_x86_64_pc_windows_gnu=$MingwPrefix\bin\ar.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=$MingwPrefix\bin\gcc.exe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup component add rustfmt clippy
          if [ "${RUNNER_OS}" = "Windows" ]; then
            rustup target add x86_64-pc-windows-gnu
          fi

      # Only main writes Rust caches; pull requests restore them. Per-branch saves
      # evicted each other under the repository cache quota and left Windows cold.
      # The Windows entry keeps its own shared key so the GNU target cache stays separate.
      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ runner.os == 'Windows' && 'windows-gnu' || '' }}
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Setup Node script runtime
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Format
        shell: bash
        run: cargo fmt --all -- --check

      - name: Lint
        shell: bash
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Test
        shell: bash
        run: cargo test --locked --workspace --all-targets

  protocol-features:
    name: Protocol feature matrix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    needs:
      - changes
      - policy-fast
      - detect-projects
    # Same condition as the other Rust jobs: a documentation-only change does
    # not build the feature matrix or take a macOS runner.
    if: >-
      ${{
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # mitm-policy builds the mitm_anixops C core from this submodule.
          submodules: true

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # Every protocol (and the desktop local proxy) is a cargo feature of
      # engine-embedded. Each one must build, lint and pass the tests alone and
      # with every other one removed.
      - name: Lint and test each protocol feature alone
        shell: bash
        run: |
          set -euo pipefail
          for features in "" dns-tls http hysteria2 iwan mieru shadowsocks snell socks trojan tuic vless vmess wireguard local-proxy mitm scripts; do
            echo "::group::engine-embedded features=[${features}]"
            cargo clippy --locked -p engine-embedded --no-default-features --features "${features}" --all-targets -- -D warnings
            cargo test --locked -p engine-embedded --no-default-features --features "${features}" --tests
            echo "::endgroup::"
          done

  script-runtime-jsc:
    name: JavaScriptCore script conformance
    runs-on: macos-26
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
    needs:
      - changes
      - policy-fast
      - detect-projects
    # Same condition as the other Rust jobs: a documentation-only change does
    # not build the feature matrix or take a macOS runner.
    if: >-
      ${{
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # mitm-policy builds the mitm_anixops C core from this submodule.
          submodules: true

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --component clippy
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: script-runtime-jsc
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The iOS script binding must pass the same $-API conformance fixtures as
      # QuickJS (only the heap-limit fixture may be skipped), and its watchdog
      # must abandon and then refuse scripts stuck past their timeout.
      - name: Lint and test the JavaScriptCore binding
        shell: bash
        run: |
          set -euo pipefail
          cargo clippy --locked -p script-runtime --features javascriptcore --all-targets -- -D warnings
          cargo test --locked -p script-runtime --features javascriptcore --test conformance -- --nocapture
          # The binding must also build for the iPhone without QuickJS, whose crate ships no iOS bindings.
          rustup target add aarch64-apple-ios
          IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo build --locked -p script-runtime --no-default-features --features javascriptcore --target aarch64-apple-ios
          # The packet tunnel runtime, MITM (engine-native, mitm-policy and its C core) and QuickJS scripts
          # included, must build for the iPhone. rquickjs has no iOS bindings, so bindgen needs the SDK.
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="-isysroot $(xcrun --sdk iphoneos --show-sdk-path)" \
            IPHONEOS_DEPLOYMENT_TARGET=17.0 cargo build --locked -p engine-embedded --lib --target aarch64-apple-ios

  rust-security-audit:
    name: Rust dependency security audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Verify checked-in lockfile
        shell: bash
        run: cargo metadata --locked --offline --no-deps --format-version=1 > /dev/null

      - name: Audit dependencies
        shell: bash
        run: cargo audit

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Check dependency licenses
        shell: bash
        run: cargo deny --locked check licenses

  reality-interop:
    name: REALITY interop (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CARGO_INCREMENTAL: "0"
      XRAY_VERSION: latest
      SINGBOX_VERSION: latest
      HYSTERIA_VERSION: latest
      MIHOMO_VERSION: latest
    needs:
      - changes
      - policy-fast
    if: >-
      ${{
        needs.changes.outputs.full_matrix == 'true' ||
        needs.changes.outputs.rust == 'true'
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      - name: Build interop tests
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p outbound-vless --test reality_interop --no-run
          cargo test --locked -p outbound-vless --test xhttp_interop --no-run
          cargo test --locked -p outbound-vmess --test vmess_interop --no-run
          cargo test --locked -p outbound-vmess --test xhttp_interop --no-run
          cargo test --locked -p outbound-trojan --test xhttp_interop --no-run
          cargo test --locked -p outbound-hysteria2 --test hysteria2_interop --no-run
          cargo test --locked -p outbound-tuic --test tuic_interop --no-run
          cargo test --locked -p outbound-snell --test snell_interop --no-run
          cargo test --locked -p outbound-mieru --test mieru_interop --no-run
          cargo test --locked -p outbound-iwan --test iwan_interop --no-run
          cargo test --locked -p node-runtime --test client_interop --no-run

      # Builds the iwand-server test server (go.mod declares go 1.22).
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: false

      - name: Download Xray-core, sing-box, Hysteria, mihomo, snell-server and mita; build iwand-server
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/reality-interop.sh download

      - name: Start REALITY servers and targets
        shell: bash
        run: bash .github/scripts/reality-interop.sh start

      - name: Run interop tests
        shell: bash
        run: |
          set -euo pipefail
          set -a
          source "${RUNNER_TEMP}/reality-interop/env"
          set +a
          cargo test --locked -p outbound-vless --test reality_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-vless --test xhttp_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-vmess --test vmess_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-vmess --test xhttp_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-trojan --test xhttp_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-hysteria2 --test hysteria2_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-tuic --test tuic_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-snell --test snell_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-mieru --test mieru_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p outbound-iwan --test iwan_interop -- --ignored --test-threads=1 --nocapture
          cargo test --locked -p node-runtime --test client_interop -- --ignored --test-threads=1 --nocapture

      # The iwand client (docs/protocols/iwan.md §10.2) logs in to anixcore's
      # iWAN inbound from a network namespace over a TUN device.
      - name: iWAN TUN interop (iwand client against inbound-iwan)
        shell: bash
        run: |
          set -euo pipefail
          cargo build --locked -p anixcore
          sudo env "RUNNER_TEMP=${RUNNER_TEMP}" "GITHUB_STEP_SUMMARY=${GITHUB_STEP_SUMMARY}" \
            "ANIXCORE=${GITHUB_WORKSPACE}/target/debug/anixcore" \
            bash .github/scripts/iwan-tun-interop.sh run

      - name: Server logs
        if: ${{ always() }}
        shell: bash
        run: |
          bash .github/scripts/reality-interop.sh logs
          sudo env "RUNNER_TEMP=${RUNNER_TEMP}" bash .github/scripts/iwan-tun-interop.sh logs

  rust-h2-mitm-fuzz:
    name: HTTP/2 MITM fuzz
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.rust == 'true' ||
          needs.changes.outputs.windows == 'true' ||
          needs.changes.outputs.linux == 'true' ||
          needs.changes.outputs.apple == 'true' ||
          needs.changes.outputs.ios == 'true'
        )
      }}
    env:
      CARGO_INCREMENTAL: "0"
      # Pull requests fuzz each target for 30 s; main, tags and manual runs for 60 s.
      FUZZ_SECONDS_PER_TARGET: ${{ github.event_name == 'pull_request' && '30' || '60' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: true

      - name: Setup Rust nightly
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install nightly --profile minimal
          rustup default nightly

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Run fuzz targets
        shell: bash
        working-directory: crates/engine-native
        run: |
          set -euo pipefail
          # The prebuilt cargo-fuzz binary is musl-linked and would default to
          # the musl target, which ASan cannot instrument.
          for target in tls_client_hello_alpn h2_mitm_frames h2_mitm_requests; do
            echo "::group::cargo fuzz run ${target}"
            cargo fuzz run --target x86_64-unknown-linux-gnu "${target}" -- \
              -max_total_time="${FUZZ_SECONDS_PER_TARGET}" \
              -max_len=4096 \
              -rss_limit_mb=2048 \
              -timeout=20
            echo "::endgroup::"
          done

      # Runtime control JSON through the iOS C entry point; the dictionary
      # holds the command and field names. Inputs above the 4 KiB request
      # limit are generated on purpose to reach the size check.
      - name: Run runtime control fuzz target
        shell: bash
        working-directory: crates/engine-embedded
        run: |
          set -euo pipefail
          cargo fuzz run --target x86_64-unknown-linux-gnu runtime_control -- \
            -max_total_time="${FUZZ_SECONDS_PER_TARGET}" \
            -dict=fuzz/dict/runtime_control.dict \
            -max_len=8192 \
            -rss_limit_mb=2048 \
            -timeout=20

      - name: Upload fuzz crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: h2-mitm-fuzz-artifacts-${{ github.sha }}
          path: |
            crates/engine-native/fuzz/artifacts
            crates/engine-embedded/fuzz/artifacts
          if-no-files-found: ignore

  ios-runtime-static-libs:
    name: iOS runtime static libraries
    runs-on: macos-26
    timeout-minutes: 45
    env:
      CARGO_INCREMENTAL: "0"
      IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    needs:
      - changes
      - policy-fast
      - detect-projects
    if: >-
      ${{
        needs.detect-projects.outputs.rust == 'true' &&
        (
          needs.changes.outputs.full_matrix == 'true' ||
          needs.changes.outputs.ios == 'true' ||
          needs.changes.outputs.apple == 'true'
        )
      }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # mitm-policy builds the mitm_anixops C core from this submodule.
          submodules: true

      - name: Setup Rust
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios

      - name: Restore Rust build cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ios-runtime
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

      # The AnixOps/anixops-net iOS and macOS apps link these static libraries through
      # the C headers below; the kernel only guarantees that they build for the iPhone.
      - name: Build the embedded runtime and node import static libraries
        shell: bash
        # rquickjs (MITM scripts) ships no iOS bindings; bindgen generates them against the iPhone SDK.
        run: |
          set -euo pipefail
          BINDGEN_EXTRA_CLANG_ARGS_aarch64_apple_ios="-isysroot $(xcrun --sdk iphoneos --show-sdk-path)" \
            cargo build --locked --release -p engine-embedded -p node-import --lib --target aarch64-apple-ios

      - name: Check the static libraries and their C headers
        shell: bash
        run: |
          set -euo pipefail
          test -s target/aarch64-apple-ios/release/libengine_embedded.a
          test -s target/aarch64-apple-ios/release/libnode_import.a
          test -f crates/engine-embedded/include/networkcore_ios_runtime.h
          test -f crates/node-import/include/networkcore_import.h

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - changes
      - policy-fast
      - policy-full
      - detect-projects
      - workspace-smoke
      - go-build-test
      - rust-build-test
      - rust-security-audit
      - reality-interop
      - rust-h2-mitm-fuzz
      - protocol-features
      - script-runtime-jsc
      - ios-runtime-static-libs
    steps:
      - name: Check required jobs
        shell: bash
        env:
          CHANGE_GROUPS: ${{ needs.changes.outputs.groups }}
          CHANGE_SOURCE: ${{ needs.changes.outputs.change_source }}
          CHANGED_FILE_COUNT: ${{ needs.changes.outputs.changed_file_count }}
          CHANGE_DOCS: ${{ needs.changes.outputs.docs }}
          CHANGE_GOVERNANCE: ${{ needs.changes.outputs.governance }}
          CHANGE_GO: ${{ needs.changes.outputs.go }}
          CHANGE_RUST: ${{ needs.changes.outputs.rust }}
          CHANGE_WINDOWS: ${{ needs.changes.outputs.windows }}
          CHANGE_LINUX: ${{ needs.changes.outputs.linux }}
          CHANGE_IOS: ${{ needs.changes.outputs.ios }}
          CHANGE_APPLE: ${{ needs.changes.outputs.apple }}
          CHANGE_WORKFLOW: ${{ needs.changes.outputs.workflow }}
          CHANGE_RELEASE_SENSITIVE: ${{ needs.changes.outputs.release_sensitive }}
          CHANGE_FULL_MATRIX: ${{ needs.changes.outputs.full_matrix }}
          CHANGE_UNKNOWN: ${{ needs.changes.outputs.unknown }}
          DETECTED_GO: ${{ needs.detect-projects.outputs.go }}
          DETECTED_RUST: ${{ needs.detect-projects.outputs.rust }}
          RESULT_CHANGES: ${{ needs.changes.result }}
          RESULT_POLICY_FAST: ${{ needs.policy-fast.result }}
          RESULT_POLICY_FULL: ${{ needs.policy-full.result }}
          RESULT_DETECT_PROJECTS: ${{ needs.detect-projects.result }}
          RESULT_WORKSPACE_SMOKE: ${{ needs.workspace-smoke.result }}
          RESULT_GO_BUILD_TEST: ${{ needs.go-build-test.result }}
          RESULT_RUST_BUILD_TEST: ${{ needs.rust-build-test.result }}
          RESULT_RUST_AUDIT: ${{ needs.rust-security-audit.result }}
          RESULT_RUST_H2_FUZZ: ${{ needs.rust-h2-mitm-fuzz.result }}
          RESULT_REALITY_INTEROP: ${{ needs.reality-interop.result }}
          RESULT_PROTOCOL_FEATURES: ${{ needs.protocol-features.result }}
          RESULT_SCRIPT_RUNTIME_JSC: ${{ needs.script-runtime-jsc.result }}
          RESULT_IOS_RUNTIME_LIBS: ${{ needs.ios-runtime-static-libs.result }}
          WORKFLOW_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail

          workspace_required=false
          go_required=false
          rust_required=false
          audit_required=false
          ios_runtime_required=false
          reality_interop_required=false

          if [[ "${CHANGE_FULL_MATRIX}" == true || "${CHANGE_GO}" == true || "${CHANGE_RUST}" == true ||
                "${CHANGE_WINDOWS}" == true || "${CHANGE_LINUX}" == true ||
                "${CHANGE_IOS}" == true || "${CHANGE_APPLE}" == true ]]; then
            workspace_required=true
          fi
          if [[ "${DETECTED_GO}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_GO}" == true) ]]; then
            go_required=true
          fi
          if [[ "${DETECTED_RUST}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_RUST}" == true ||
                "${CHANGE_WINDOWS}" == true || "${CHANGE_LINUX}" == true || "${CHANGE_IOS}" == true ||
                "${CHANGE_APPLE}" == true) ]]; then
            rust_required=true
            audit_required=true
          fi
          if [[ "${CHANGE_FULL_MATRIX}" == true || "${CHANGE_RUST}" == true ]]; then
            reality_interop_required=true
          fi
          if [[ "${DETECTED_RUST}" == true && ("${CHANGE_FULL_MATRIX}" == true || "${CHANGE_IOS}" == true ||
                "${CHANGE_APPLE}" == true) ]]; then
            ios_runtime_required=true
          fi

          ran_jobs=()
          skipped_jobs=()
          failed_jobs=()
          gate_failures=()

          record_job() {
            local name="$1"
            local result="$2"
            local expected="$3"

            case "${result}" in
              success)
                ran_jobs+=("${name}")
                ;;
              skipped)
                skipped_jobs+=("${name}")
                if [[ "${expected}" == true ]]; then
                  gate_failures+=("${name} was required but skipped")
                fi
                ;;
              failure)
                ran_jobs+=("${name}")
                failed_jobs+=("${name}")
                gate_failures+=("${name} failed")
                ;;
              cancelled)
                ran_jobs+=("${name}")
                failed_jobs+=("${name} (cancelled)")
                gate_failures+=("${name} was cancelled")
                ;;
              *)
                gate_failures+=("${name} returned unexpected result '${result}'")
                ;;
            esac
          }

          record_job "Detect changed paths" "${RESULT_CHANGES}" true
          record_job "Repository policy (fast)" "${RESULT_POLICY_FAST}" true
          record_job "Repository policy" "${RESULT_POLICY_FULL}" true
          record_job "Detect project types" "${RESULT_DETECT_PROJECTS}" true
          record_job "Workspace smoke" "${RESULT_WORKSPACE_SMOKE}" "${workspace_required}"
          record_job "Go build and test" "${RESULT_GO_BUILD_TEST}" "${go_required}"
          record_job "Rust build and test" "${RESULT_RUST_BUILD_TEST}" "${rust_required}"
          record_job "Rust dependency security audit" "${RESULT_RUST_AUDIT}" "${audit_required}"
          record_job "HTTP/2 MITM fuzz" "${RESULT_RUST_H2_FUZZ}" "${rust_required}"
          record_job "REALITY interop (Linux)" "${RESULT_REALITY_INTEROP}" "${reality_interop_required}"
          record_job "Protocol feature matrix" "${RESULT_PROTOCOL_FEATURES}" "${rust_required}"
          record_job "JavaScriptCore script conformance" "${RESULT_SCRIPT_RUNTIME_JSC}" "${rust_required}"
          record_job "iOS runtime static libraries" "${RESULT_IOS_RUNTIME_LIBS}" "${ios_runtime_required}"

          join_list() {
            local joined
            if [[ "$#" -eq 0 ]]; then
              echo "none"
              return
            fi
            joined="$(IFS=', '; echo "$*")"
            echo "${joined}"
          }

          gate_conclusion=success
          next_action="No action required; this commit is eligible for downstream gates."
          if [[ "${#gate_failures[@]}" -gt 0 ]]; then
            gate_conclusion=failure
            next_action="Inspect only the failed or cancelled job steps, fix them, and rerun CI."
          fi

          {
            echo "### CI Summary"
            echo
            echo "| Run | Value |"
            echo "| --- | --- |"
            echo "| Commit SHA | ${{ github.sha }} |"
            echo "| Workflow run ID | ${{ github.run_id }} |"
            echo "| Workflow run | ${WORKFLOW_URL} |"
            echo "| Gate conclusion | ${gate_conclusion} |"
            echo "| Change source | ${CHANGE_SOURCE} |"
            echo "| Changed files | ${CHANGED_FILE_COUNT} |"
            echo "| Changed groups | ${CHANGE_GROUPS} |"
            echo "| Ran jobs | $(join_list "${ran_jobs[@]}") |"
            echo "| Skipped jobs | $(join_list "${skipped_jobs[@]}") |"
            echo "| Failed jobs | $(join_list "${failed_jobs[@]}") |"
            echo "| Next action | ${next_action} |"
            echo
            echo "| Path group | Changed |"
            echo "| --- | --- |"
            echo "| docs | ${CHANGE_DOCS} |"
            echo "| governance | ${CHANGE_GOVERNANCE} |"
            echo "| go | ${CHANGE_GO} |"
            echo "| rust | ${CHANGE_RUST} |"
            echo "| windows | ${CHANGE_WINDOWS} |"
            echo "| linux | ${CHANGE_LINUX} |"
            echo "| ios | ${CHANGE_IOS} |"
            echo "| apple | ${CHANGE_APPLE} |"
            echo "| workflow | ${CHANGE_WORKFLOW} |"
            echo "| release_sensitive | ${CHANGE_RELEASE_SENSITIVE} |"
            echo "| full_matrix | ${CHANGE_FULL_MATRIX} |"
            echo "| unknown | ${CHANGE_UNKNOWN} |"
            echo
            echo "| Job | Required | Result |"
            echo "| --- | --- | --- |"
            echo "| Detect changed paths | true | ${RESULT_CHANGES} |"
            echo "| Repository policy (fast) | true | ${RESULT_POLICY_FAST} |"
            echo "| Repository policy | true | ${RESULT_POLICY_FULL} |"
            echo "| Detect project types | true | ${RESULT_DETECT_PROJECTS} |"
            echo "| Workspace smoke | ${workspace_required} | ${RESULT_WORKSPACE_SMOKE} |"
            echo "| Go build and test | ${go_required} | ${RESULT_GO_BUILD_TEST} |"
            echo "| Rust build and test | ${rust_required} | ${RESULT_RUST_BUILD_TEST} |"
            echo "| Rust dependency security audit | ${audit_required} | ${RESULT_RUST_AUDIT} |"
            echo "| REALITY interop (Linux) | ${reality_interop_required} | ${RESULT_REALITY_INTEROP} |"
            echo "| HTTP/2 MITM fuzz | ${rust_required} | ${RESULT_RUST_H2_FUZZ} |"
            echo "| Protocol feature matrix | ${rust_required} | ${RESULT_PROTOCOL_FEATURES} |"
            echo "| JavaScriptCore script conformance | ${rust_required} | ${RESULT_SCRIPT_RUNTIME_JSC} |"
            echo "| iOS runtime static libraries | ${ios_runtime_required} | ${RESULT_IOS_RUNTIME_LIBS} |"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "commit-sha=${{ github.sha }}"
          echo "workflow-run-id=${{ github.run_id }}"
          echo "workflow-run-url=${WORKFLOW_URL}"
          echo "changed-groups=${CHANGE_GROUPS}"
          echo "ran-jobs=$(join_list "${ran_jobs[@]}")"
          echo "skipped-jobs=$(join_list "${skipped_jobs[@]}")"
          echo "failed-jobs=$(join_list "${failed_jobs[@]}")"
          echo "ci-gate-conclusion=${gate_conclusion}"

          if [[ "${gate_conclusion}" != success ]]; then
            printf '::error::%s\n' "$(join_list "${gate_failures[@]}")"
            exit 1
          fi
