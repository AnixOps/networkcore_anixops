name: CI

on:
  push:
    branches:
      - main
      - master
      - develop
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs: ${{ steps.changes.outputs.docs }}
      governance: ${{ steps.changes.outputs.governance }}
      go: ${{ steps.changes.outputs.go }}
      rust: ${{ steps.changes.outputs.rust }}
      node: ${{ steps.changes.outputs.node }}
      windows: ${{ steps.changes.outputs.windows }}
      linux: ${{ steps.changes.outputs.linux }}
      ios: ${{ steps.changes.outputs.ios }}
      apple: ${{ steps.changes.outputs.apple }}
      workflow: ${{ steps.changes.outputs.workflow }}
      release_sensitive: ${{ steps.changes.outputs.release_sensitive }}
      full_matrix: ${{ steps.changes.outputs.full_matrix }}
      unknown: ${{ steps.changes.outputs.unknown }}
      change_source: ${{ steps.changes.outputs.change_source }}
      changed_file_count: ${{ steps.changes.outputs.changed_file_count }}
      groups: ${{ steps.changes.outputs.groups }}
      validation_matrix: ${{ steps.changes.outputs.validation_matrix }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed paths
        id: changes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: bash .github/scripts/detect-ci-changes.sh

      - name: Summarize changed paths
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### Changed Paths"
            echo
            echo "| Item | Value |"
            echo "| --- | --- |"
            echo "| Source | ${{ steps.changes.outputs.change_source }} |"
            echo "| Files | ${{ steps.changes.outputs.changed_file_count }} |"
            echo "| Groups | ${{ steps.changes.outputs.groups }} |"
            echo "| Full matrix | ${{ steps.changes.outputs.full_matrix }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  policy-fast:
    name: Repository policy (fast)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs:
      - changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify fast repository policy
        shell: bash
        env:
          WINDOWS_CHANGED: ${{ needs.changes.outputs.windows }}
          LINUX_CHANGED: ${{ needs.changes.outputs.linux }}
          APPLE_CHANGED: ${{ needs.changes.outputs.apple }}
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Fast repository policy failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit ${status}' ERR

          required_files=(
            AGENT.md
            AGENTS.md
            CLAUDE.md
            CONTRIBUTING.md
            README.md
            ROADMAP.md
            TODO.md
            CHANGELOG.md
            LICENSE
            Cargo.toml
            Cargo.lock
            docs/ci-cd-policy.md
            docs/manual-intervention.md
            .github/copilot-instructions.md
            .github/scripts/detect-ci-changes.sh
            .github/workflows/ci.yml
            .github/workflows/release.yml
          )
          for file in "${required_files[@]}"; do
            test -f "${file}"
          done

          tracked_paths="$(git ls-files)"
          if grep -Eq '(^|/)(target|dist|node_modules|coverage|\.next|\.turbo|\.gradle|DerivedData)(/|$)' <<< "${tracked_paths}"; then
            echo "::error::Tracked local build or package output is forbidden."
            grep -E '(^|/)(target|dist|node_modules|coverage|\.next|\.turbo|\.gradle|DerivedData)(/|$)' <<< "${tracked_paths}"
            exit 1
          fi
          if grep -Eiq '(^|/)(id_(rsa|dsa|ecdsa|ed25519)|\.env($|\.)|[^/]+\.(p12|pfx|jks|keystore|mobileprovision|provisionprofile|key|pem))$' <<< "${tracked_paths}"; then
            echo "::error::Tracked credential, signing, or private-key material is forbidden."
            grep -Ei '(^|/)(id_(rsa|dsa|ecdsa|ed25519)|\.env($|\.)|[^/]+\.(p12|pfx|jks|keystore|mobileprovision|provisionprofile|key|pem))$' <<< "${tracked_paths}"
            exit 1
          fi
          if git grep -nEI '(AKIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|AIza[0-9A-Za-z_-]{35})' -- ':!*.md' ':!.github/workflows/ci.yml'; then
            echo "::error::A tracked source or configuration file contains an obvious credential pattern."
            exit 1
          fi

          grep -q '^name: CI$' .github/workflows/ci.yml
          grep -q '^  changes:$' .github/workflows/ci.yml
          grep -q '^  policy-fast:$' .github/workflows/ci.yml
          grep -q '^  policy-full:$' .github/workflows/ci.yml
          grep -q '^  ci-summary:$' .github/workflows/ci.yml
          grep -q '^name: Release$' .github/workflows/release.yml
          grep -q '^  release-ci-gate:$' .github/workflows/release.yml
          grep -q '^  publish-eligibility-gate:$' .github/workflows/release.yml
          grep -q '^  publish-github-release:$' .github/workflows/release.yml

          grep -q "当前阶段进入 P4 Client And Platform Integration" README.md
          grep -q "当前阶段：P4 Client And Platform Integration" ROADMAP.md
          grep -q "当前阶段是 P4 Client And Platform Integration" TODO.md
          grep -q '^linux-artifact-release-state=confirmed-release-path$' docs/manual-intervention.md

          if [[ "${WINDOWS_CHANGED}" == true ]]; then
            test -f apps/windows-gui/Cargo.toml
            test -f apps/windows-gui/ui/package.json
            test -f apps/windows-service/Cargo.toml
            test -f installer/windows/Package.wxs
          fi
          if [[ "${LINUX_CHANGED}" == true ]]; then
            test -f apps/linux-cli/Cargo.toml
            test -f crates/platform-linux/Cargo.toml
          fi
          if [[ "${APPLE_CHANGED}" == true ]]; then
            test -f apps/ios/README.md
            test -f crates/platform-ios/Cargo.toml
          fi

          echo "Fast repository policy passed."

      - name: Verify change classifier contracts
        shell: bash
        run: |
          set -euo pipefail
          classifier="${GITHUB_WORKSPACE}/.github/scripts/detect-ci-changes.sh"
          fixture="$(mktemp -d)"
          trap 'rm -rf "${fixture}"' EXIT

          git -C "${fixture}" init --quiet
          git -C "${fixture}" config user.name ci-path-contract
          git -C "${fixture}" config user.email ci-path-contract@example.invalid
          echo seed > "${fixture}/seed.txt"
          git -C "${fixture}" add seed.txt
          git -C "${fixture}" commit --quiet -m seed

          classify_commit() {
            local base_sha="$1"
            local head_sha="$2"
            local output_file="$3"
            (
              cd "${fixture}"
              EVENT_NAME=push \
                REF_TYPE=branch \
                BASE_SHA="${base_sha}" \
                HEAD_SHA="${head_sha}" \
                GITHUB_OUTPUT="${output_file}" \
                RUNNER_TEMP="${fixture}" \
                bash "${classifier}"
            )
          }

          base_sha="$(git -C "${fixture}" rev-parse HEAD)"
          mkdir -p "${fixture}/docs"
          echo docs > "${fixture}/docs/guide.md"
          git -C "${fixture}" add docs/guide.md
          git -C "${fixture}" commit --quiet -m docs
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          docs_output="${fixture}/docs.output"
          classify_commit "${base_sha}" "${head_sha}" "${docs_output}"
          grep -qx 'docs=true' "${docs_output}"
          grep -qx 'full_matrix=false' "${docs_output}"

          base_sha="${head_sha}"
          echo lock > "${fixture}/Cargo.lock"
          git -C "${fixture}" add Cargo.lock
          git -C "${fixture}" commit --quiet -m lock
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          lock_output="${fixture}/lock.output"
          classify_commit "${base_sha}" "${head_sha}" "${lock_output}"
          grep -qx 'rust=true' "${lock_output}"
          grep -qx 'release_sensitive=true' "${lock_output}"
          grep -qx 'full_matrix=true' "${lock_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/crates/control-domain/src"
          echo shared > "${fixture}/crates/control-domain/src/lib.rs"
          git -C "${fixture}" add crates/control-domain/src/lib.rs
          git -C "${fixture}" commit --quiet -m shared-rust
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          shared_output="${fixture}/shared.output"
          classify_commit "${base_sha}" "${head_sha}" "${shared_output}"
          grep -qx 'rust=true' "${shared_output}"
          grep -qx 'full_matrix=true' "${shared_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/apps/windows-cli/src"
          echo windows > "${fixture}/apps/windows-cli/src/main.rs"
          git -C "${fixture}" add apps/windows-cli/src/main.rs
          git -C "${fixture}" commit --quiet -m windows
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          windows_output="${fixture}/windows.output"
          classify_commit "${base_sha}" "${head_sha}" "${windows_output}"
          grep -qx 'rust=true' "${windows_output}"
          grep -qx 'windows=true' "${windows_output}"
          grep -qx 'full_matrix=false' "${windows_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"windows-latest","timeout":45}]}' "${windows_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/docs/architecture"
          echo windows-docs > "${fixture}/docs/architecture/windows-ci-notes.md"
          git -C "${fixture}" add docs/architecture/windows-ci-notes.md
          git -C "${fixture}" commit --quiet -m windows-docs
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          windows_docs_output="${fixture}/windows-docs.output"
          classify_commit "${base_sha}" "${head_sha}" "${windows_docs_output}"
          grep -qx 'docs=true' "${windows_docs_output}"
          grep -qx 'windows=false' "${windows_docs_output}"
          grep -qx 'full_matrix=false' "${windows_docs_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"ubuntu-latest","timeout":30}]}' "${windows_docs_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/apps/linux-cli/src"
          echo linux > "${fixture}/apps/linux-cli/src/main.rs"
          git -C "${fixture}" add apps/linux-cli/src/main.rs
          git -C "${fixture}" commit --quiet -m linux
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          linux_output="${fixture}/linux.output"
          classify_commit "${base_sha}" "${head_sha}" "${linux_output}"
          grep -qx 'rust=true' "${linux_output}"
          grep -qx 'linux=true' "${linux_output}"
          grep -qx 'full_matrix=false' "${linux_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"ubuntu-latest","timeout":30}]}' "${linux_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/apps/windows-gui/ui/src"
          echo node > "${fixture}/apps/windows-gui/ui/src/App.tsx"
          git -C "${fixture}" add apps/windows-gui/ui/src/App.tsx
          git -C "${fixture}" commit --quiet -m node-ui
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          node_output="${fixture}/node.output"
          classify_commit "${base_sha}" "${head_sha}" "${node_output}"
          grep -qx 'node=true' "${node_output}"
          grep -qx 'windows=true' "${node_output}"
          grep -qx 'full_matrix=false' "${node_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/apps/ios/Sources"
          echo apple > "${fixture}/apps/ios/Sources/App.swift"
          git -C "${fixture}" add apps/ios/Sources/App.swift
          git -C "${fixture}" commit --quiet -m apple
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          apple_output="${fixture}/apple.output"
          classify_commit "${base_sha}" "${head_sha}" "${apple_output}"
          grep -qx 'ios=true' "${apple_output}"
          grep -qx 'apple=true' "${apple_output}"
          grep -Fqx 'validation_matrix={"include":[{"os":"macos-26","timeout":40}]}' "${apple_output}"

          base_sha="${head_sha}"
          echo unknown > "${fixture}/unknown.file"
          git -C "${fixture}" add unknown.file
          git -C "${fixture}" commit --quiet -m unknown
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          unknown_output="${fixture}/unknown.output"
          classify_commit "${base_sha}" "${head_sha}" "${unknown_output}"
          grep -qx 'unknown=true' "${unknown_output}"
          grep -qx 'full_matrix=true' "${unknown_output}"

          base_sha="${head_sha}"
          mkdir -p "${fixture}/.github/workflows"
          echo workflow > "${fixture}/.github/workflows/ci.yml"
          git -C "${fixture}" add .github/workflows/ci.yml
          git -C "${fixture}" commit --quiet -m workflow
          head_sha="$(git -C "${fixture}" rev-parse HEAD)"
          workflow_output="${fixture}/workflow.output"
          classify_commit "${base_sha}" "${head_sha}" "${workflow_output}"
          grep -qx 'workflow=true' "${workflow_output}"
          grep -qx 'full_matrix=true' "${workflow_output}"

          dispatch_output="${fixture}/dispatch.output"
          (
            cd "${fixture}"
            EVENT_NAME=workflow_dispatch \
              REF_TYPE=branch \
              GITHUB_OUTPUT="${dispatch_output}" \
              RUNNER_TEMP="${fixture}" \
              bash "${classifier}"
          )
          grep -qx 'change_source=workflow_dispatch' "${dispatch_output}"
          grep -qx 'full_matrix=true' "${dispatch_output}"

          tag_output="${fixture}/tag.output"
          (
            cd "${fixture}"
            EVENT_NAME=push \
              REF_TYPE=tag \
              GITHUB_OUTPUT="${tag_output}" \
              RUNNER_TEMP="${fixture}" \
              bash "${classifier}"
          )
          grep -qx 'change_source=tag' "${tag_output}"
          grep -qx 'full_matrix=true' "${tag_output}"

  policy-full:
    name: Repository policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs:
      - changes
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify governance and release contracts
        shell: bash
        run: |
          set -euo pipefail
          trap 'status=$?; echo "::error::Repository policy failed at line ${LINENO}: ${BASH_COMMAND} (exit ${status})"; exit ${status}' ERR

          required_files=(
            AGENT.md
            AGENTS.md
            README.md
            CONTRIBUTING.md
            ROADMAP.md
            TODO.md
            CHANGELOG.md
            LICENSE
            Cargo.toml
            Cargo.lock
            docs/ci-cd-policy.md
            docs/manual-intervention.md
            docs/release-strategy.md
            docs/architecture/windows-gui-daily-usability.md
            docs/alpha-windows-smoke-test.md
            .github/workflows/release.yml
            apps/linux-cli/Cargo.toml
            apps/linux-cli/README.md
            apps/linux-cli/src/main.rs
            apps/linux-cli/src/lib.rs
            apps/linux-cli/tests/linux_cli_contracts.rs
            apps/windows-cli/Cargo.toml
            apps/windows-cli/src/main.rs
            apps/windows-gui/Cargo.toml
            apps/windows-gui/build.rs
            apps/windows-gui/tauri.conf.json
            apps/windows-gui/icons/networkcore.png
            apps/windows-gui/src/main.rs
            apps/windows-gui/src/gui/tauri_ui.rs
            apps/windows-gui/ui/package.json
            apps/windows-gui/ui/src/App.tsx
            apps/windows-gui/src/gui/commands.rs
            apps/windows-gui/src/gui/runtime_status.rs
            apps/windows-gui/src/gui/shell.rs
            apps/windows-gui/src/gui/theme.rs
            apps/windows-gui/src/gui/ui_state.rs
            apps/windows-gui/src/gui/widgets.rs
            apps/windows-service/Cargo.toml
            apps/windows-service/src/lib.rs
            apps/windows-service/src/main.rs
            crates/platform-windows/src/managed.rs
            crates/platform-windows/src/system_integration.rs
            installer/windows/Package.wxs
            installer/windows/default-managed-config.json
            crates/config-core/README.md
            crates/control-domain/README.md
            crates/control-runtime/README.md
            crates/engine-native/README.md
            crates/engine-singbox/Cargo.toml
            crates/engine-singbox/README.md
            crates/engine-singbox/src/lib.rs
            crates/engine-singbox/tests/engine_singbox_contracts.rs
