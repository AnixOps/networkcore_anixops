# cargo-deny configuration. CI runs `cargo deny check licenses` in the
# `rust-security-audit` job (advisories stay with cargo-audit).
#
# Policy (2026-10-23): NetworkCore is Apache-2.0 and ships closed-source App
# Store clients on top of it, so only permissive and file-level copyleft
# licenses are allowed. GPL/AGPL/LGPL-only/SSPL and source-available licenses
# are rejected; a crate offering one of them as an alternative ("MIT OR LGPL")
# is fine because the permissive option is chosen.

[graph]
all-features = true

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "allow"
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    # File-level copyleft: unmodified use only needs attribution. Modified
    # MPL files must be published.
    "MPL-2.0",
    "OpenSSL",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "Zlib",
]

[licenses.private]
# Workspace crates are not published; their license comes from the workspace.
ignore = true
