[package]
name = "tls-mimic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Browser-shaped TLS 1.3 ClientHello fingerprints and a minimal TLS 1.3 client with handshake hooks (REALITY and similar protocols)."

[dependencies]
ml-kem = "0.2.1"
rand_core = { version = "0.6.4", features = ["getrandom"] }
ring = "0.17.14"
tokio = { version = "1", default-features = false, features = ["io-util"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "macros"] }

[lib]
path = "src/lib.rs"
