[package]
name = "inbound-shadowsocks"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Shadowsocks-2022 (SIP022) and Shadowsocks AEAD (SIP004) TCP and UDP server inbounds, multi-user, with built-in simple-obfs and v2ray-plugin WebSocket."

[dependencies]
# Block cipher for Shadowsocks-2022 identity headers only; session data uses ring.
aes = "0.9"
base64 = "0.22"
blake3 = "1.8"
# XChaCha20-Poly1305 for 2022-blake3-chacha20-poly1305 UDP packets (ring has
# no extended-nonce ChaCha).
chacha20poly1305 = { version = "0.10", default-features = false }
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
# TLS and the WebSocket transport, for v2ray-plugin clients.
inbound-transport = { path = "../inbound-transport" }
# Shares the method names and key lengths with the client outbound.
outbound-shadowsocks = { path = "../outbound-shadowsocks" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "time"] }

[dev-dependencies]
rcgen = "0.14.8"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }
transport-tls = { path = "../transport-tls" }
transport-ws = { path = "../transport-ws" }

# Reference Shadowsocks client for interop tests only (builds aws-lc, so unix only).
[target.'cfg(unix)'.dev-dependencies]
shadowsocks = { version = "1.25", default-features = false, features = ["aead-cipher", "aead-cipher-2022"] }

[lib]
path = "src/lib.rs"
