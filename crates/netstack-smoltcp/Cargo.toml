# Vendored from netstack-smoltcp 0.2.4 (https://github.com/cavivie/netstack-smoltcp,
# MIT OR Apache-2.0) so the packet tunnel's userspace stack can be tuned for
# phones: idle wakeups, per-connection memory, per-packet work. See README.md.
[package]
name = "netstack-smoltcp"
version = "0.2.4"
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false
description = "Userspace TCP/IP stack (smoltcp) turning TUN packets into TCP streams and UDP packets; vendored for NetworkCore."

[dependencies]
etherparse = "0.16"
futures = "0.3"
rand = "0.8"
smoltcp = { version = "0.12", default-features = false, features = ["std", "log", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-icmp", "socket-udp", "socket-tcp"] }
spin = "0.9"
tokio = { version = "1", features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7.10"
tracing = { version = "0.1", default-features = false, features = ["std"] }

[lib]
path = "src/lib.rs"
