[package]
name = "engine-native"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Minimal native proxy engine adapter contracts for the AnixOps network control kernel."

[dependencies]
bytes = "1"
control-domain = { path = "../control-domain" }
h2 = "0.4"
http = "1"
rcgen = { version = "0.14.8", features = ["x509-parser"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["net", "rt", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
webpki-roots = "1.0.8"

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "time"] }

[lib]
path = "src/lib.rs"
