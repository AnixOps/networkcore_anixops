[package]
name = "engine-native-fuzz"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false
description = "cargo-fuzz targets for the engine-native HTTP/2 MITM data plane."

[package.metadata]
cargo-fuzz = true

# Standalone workspace: the fuzz crate needs nightly sanitizers and is built
# only by the CI fuzz job, never by the locked stable workspace matrix.
[workspace]
members = ["."]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bytes = "1"
control-domain = { path = "../../control-domain" }
engine-native = { path = ".." }
h2 = "0.4"
http = "1"
libfuzzer-sys = "0.4"
mitm-policy = { path = "../../mitm-policy" }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "time"] }

[lib]
path = "src/lib.rs"

[[bin]]
name = "h2_mitm_frames"
path = "fuzz_targets/h2_mitm_frames.rs"
test = false
doc = false
bench = false

[[bin]]
name = "h2_mitm_requests"
path = "fuzz_targets/h2_mitm_requests.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tls_client_hello_alpn"
path = "fuzz_targets/tls_client_hello_alpn.rs"
test = false
doc = false
bench = false
