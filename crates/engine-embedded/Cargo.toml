[package]
name = "engine-embedded"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "In-process engine for the iOS Network Extension: userspace TCP/IP, pluggable outbounds and the C ABI."

# One feature per protocol; see src/protocols.rs. `direct` is always built in.
[features]
default = ["dns-tls", "http", "hysteria2", "iwan", "local-proxy", "mieru", "mitm", "scripts", "shadowsocks", "snell", "socks", "trojan", "tuic", "vless", "vmess", "wireguard"]
# DNS over TLS and DNS over HTTPS upstreams (`tls://`, `https://`).
dns-tls = ["dep:transport-tls"]
http = ["dep:outbound-http"]
hysteria2 = ["dep:outbound-hysteria2"]
# Panabit iWAN: a layer-3 tunnel used as a routable outbound with its own stack.
iwan = ["dep:outbound-iwan"]
# Desktop local proxy (SOCKS5/HTTP listener), URL delay tests and remote rule
# set downloads (with optional Ed25519 signatures).
local-proxy = ["dep:base64", "dep:inbound-mixed", "dep:ring", "dep:transport-tls"]
mieru = ["dep:outbound-mieru"]
# HTTPS decryption with the shared mitm-policy rewrite engine (src/mitm).
mitm = ["dep:base64", "dep:engine-native", "dep:mitm-policy", "dep:rcgen", "dep:rustls", "dep:time", "dep:tokio-rustls", "dep:transport-tls"]
# `[Script]` execution for MITM plugins in QuickJS (script-runtime).
scripts = ["mitm", "engine-native/quickjs"]
shadowsocks = ["dep:outbound-shadowsocks"]
snell = ["dep:outbound-snell"]
socks = ["dep:outbound-socks"]
trojan = ["dep:outbound-trojan"]
# Delivered ClientHello fingerprint bundles (`tls_fingerprints` in the runtime
# config) for outbounds that imitate a browser; on with `vless`, and for
# out-of-tree outbounds built on tls-mimic.
tls-fingerprints = ["dep:tls-mimic"]
tuic = ["dep:outbound-tuic"]
vless = ["dep:outbound-vless", "tls-fingerprints"]
vmess = ["dep:outbound-vmess"]
# Whole-device WireGuard tunnel (a single `outbound`) plus the routable
# WireGuard outbound of `outbound-wireguard` for routed configs.
wireguard = ["dep:base64", "dep:boringtun", "dep:outbound-wireguard", "dep:ring"]

[dependencies]
base64 = { version = "0.22", optional = true }
# WireGuard Noise state machine only; the `device` feature (its own TUN and sockets) stays off.
boringtun = { version = "0.7", default-features = false, optional = true }
config-core = { path = "../config-core" }
control-domain = { path = "../control-domain" }
engine-native = { path = "../engine-native", default-features = false, optional = true }
engine-outbound = { path = "../engine-outbound" }
futures = "0.3"
inbound-mixed = { path = "../inbound-mixed", optional = true }
mitm-policy = { path = "../mitm-policy", optional = true }
netstack-smoltcp = { path = "../netstack-smoltcp" }
node-import = { path = "../node-import" }
outbound-http = { path = "../outbound-http", optional = true }
outbound-hysteria2 = { path = "../outbound-hysteria2", optional = true }
outbound-iwan = { path = "../outbound-iwan", optional = true }
outbound-mieru = { path = "../outbound-mieru", optional = true }
outbound-shadowsocks = { path = "../outbound-shadowsocks", optional = true }
outbound-snell = { path = "../outbound-snell", optional = true }
outbound-socks = { path = "../outbound-socks", optional = true }
outbound-trojan = { path = "../outbound-trojan", optional = true }
outbound-tuic = { path = "../outbound-tuic", optional = true }
outbound-vless = { path = "../outbound-vless", optional = true }
outbound-vmess = { path = "../outbound-vmess", optional = true }
outbound-wireguard = { path = "../outbound-wireguard", optional = true }
rcgen = { version = "0.14.8", features = ["x509-parser"], optional = true }
ring = { version = "0.17", optional = true }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", optional = true }
tls-mimic = { path = "../tls-mimic", optional = true }
tokio = { version = "1", default-features = false, features = ["rt", "net", "io-util", "time", "sync", "macros"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"], optional = true }
transport-tls = { path = "../transport-tls", optional = true }

# Desktop PROCESS-NAME lookup (src/process.rs) and the tunnel's bound interface
# (networkcore_ios_set_bound_interface, IP_BOUND_IF).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_System_Threading",
] }

[dev-dependencies]
base64 = "0.22"
boringtun = { version = "0.7", default-features = false }
engine-inbound = { path = "../engine-inbound" }
etherparse = "0.16"
# tests/via_chain.rs: an iWAN line and a Shadowsocks-2022 land node in process.
inbound-iwan = { path = "../inbound-iwan" }
inbound-mixed = { path = "../inbound-mixed" }
inbound-shadowsocks = { path = "../inbound-shadowsocks" }
# tests/rule_sets.rs: signs lists for the signature check.
ring = "0.17"
tokio = { version = "1", default-features = false, features = ["rt", "rt-multi-thread", "net", "io-util", "time", "sync", "macros"] }

# Linux TUN benchmark of the packet tunnel (.github/workflows/perf.yml).
[target.'cfg(target_os = "linux")'.dev-dependencies]
libc = "0.2"

[[example]]
name = "tunnel_bench"
required-features = ["shadowsocks"]

[lib]
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]
