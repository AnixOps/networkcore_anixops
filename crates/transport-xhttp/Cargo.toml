[package]
name = "transport-xhttp"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "XHTTP (Xray SplitHTTP) client transport over HTTP/1.1 and HTTP/2, shared by outbound protocol crates."

[dependencies]
bytes = "1"
engine-outbound = { path = "../engine-outbound" }
h2 = "0.4"
http = "1"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync", "time"] }
transport-tls = { path = "../transport-tls" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "net", "rt", "rt-multi-thread", "sync", "time"] }

[lib]
path = "src/lib.rs"
