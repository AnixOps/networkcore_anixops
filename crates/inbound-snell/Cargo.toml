[package]
name = "inbound-snell"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Snell v1-v4/v6 server inbound with optional per-user keys."

[dependencies]
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
# Frame codec, request format and obfs shared with the client outbound.
outbound-snell = { path = "../outbound-snell" }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
