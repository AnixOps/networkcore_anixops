[package]
name = "outbound-tuic"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "TUIC v5 TCP and UDP outbound over QUIC for the embedded engine."

[dependencies]
bytes = "1"
engine-outbound = { path = "../engine-outbound" }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "rt", "sync"] }
transport-quic = { path = "../transport-quic" }
transport-tls = { path = "../transport-tls" }

[dev-dependencies]
quinn = { version = "0.11.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rcgen = "0.14.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
