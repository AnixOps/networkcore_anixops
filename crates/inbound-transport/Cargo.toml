[package]
name = "inbound-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server-side transports for protocol inbounds: TLS with certificate reload."

[dependencies]
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", default-features = false, features = ["io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

[dev-dependencies]
rcgen = "0.14.8"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }
transport-tls = { path = "../transport-tls" }

[lib]
path = "src/lib.rs"
