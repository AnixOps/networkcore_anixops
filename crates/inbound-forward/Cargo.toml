[package]
name = "inbound-forward"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Port forward inbound: listen port to one or several host:port targets, TCP and UDP, with balancing, health checks and per-rule limits."

[dependencies]
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
serde = { version = "1", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "time", "macros"] }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time", "test-util"] }

[lib]
path = "src/lib.rs"
