[package]
name = "node-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Node server runtime: inbounds by tag, direct outbound and a local management API for node agents."

[features]
default = ["shadowsocks", "trojan", "vless", "vmess", "hysteria2", "tuic", "snell"]
shadowsocks = ["dep:inbound-shadowsocks"]
trojan = ["dep:inbound-trojan"]
snell = ["dep:inbound-snell"]
vless = ["dep:inbound-vless"]
vmess = ["dep:inbound-vmess"]
hysteria2 = ["dep:inbound-hysteria2"]
tuic = ["dep:inbound-tuic"]

[dependencies]
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
inbound-hysteria2 = { path = "../inbound-hysteria2", optional = true }
inbound-shadowsocks = { path = "../inbound-shadowsocks", optional = true }
inbound-snell = { path = "../inbound-snell", optional = true }
inbound-trojan = { path = "../inbound-trojan", optional = true }
inbound-tuic = { path = "../inbound-tuic", optional = true }
inbound-vless = { path = "../inbound-vless", optional = true }
inbound-vmess = { path = "../inbound-vmess", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "sync", "time", "macros"] }

[dev-dependencies]
outbound-shadowsocks = { path = "../outbound-shadowsocks" }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "sync", "time", "macros"] }

[lib]
path = "src/lib.rs"
