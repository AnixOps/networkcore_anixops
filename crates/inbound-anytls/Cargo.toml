[package]
name = "inbound-anytls"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AnyTLS server inbound with per-user passwords, UDP over TCP and fallback."

[dependencies]
engine-inbound = { path = "../engine-inbound" }
engine-outbound = { path = "../engine-outbound" }
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
inbound-transport = { path = "../inbound-transport" }
md-5 = "0.10"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
tokio = { version = "1", default-features = false, features = ["io-util", "macros", "sync", "time"] }

[dev-dependencies]
rcgen = "0.14.8"
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "sync", "time"] }
transport-tls = { path = "../transport-tls" }

[lib]
path = "src/lib.rs"
