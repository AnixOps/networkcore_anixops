[package]
name = "engine-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable outbound interfaces shared by the embedded engine and its protocol crates."

[dependencies]
# QUIC Initial keys (HKDF, AES-128-GCM, header protection) to read the SNI
# of a QUIC client's first packets (src/quic_sniff.rs).
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# sync, rt and macros for the client multiplexer (`mux`).
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "macros", "time"] }

[lib]
path = "src/lib.rs"
