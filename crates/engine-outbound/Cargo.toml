[package]
name = "engine-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable outbound interfaces shared by the embedded engine and its protocol crates."

[dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "macros"] }

[lib]
path = "src/lib.rs"
