[package]
name = "engine-outbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pluggable outbound interfaces shared by the embedded engine and its protocol crates."

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "rt", "macros", "time"] }

[lib]
path = "src/lib.rs"
