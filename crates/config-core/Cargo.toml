[package]
name = "config-core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure minimal configuration service for the AnixOps network control kernel."

[dependencies]
base64 = "0.22"
control-domain = { path = "../control-domain" }
# Node name filters of imported policy groups (Surge `policy-regex-filter`,
# Clash `filter`).
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-case", "unicode-perl"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "0.0.29"
time = { version = "0.3", features = ["parsing"] }
toml = "0.9"

[lib]
path = "src/lib.rs"
