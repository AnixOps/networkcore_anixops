[package]
name = "outbound-vmess"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VMess AEAD TCP outbound (over TCP, TLS or WebSocket) for the embedded engine."

[dependencies]
# AuthID block encryption only; AEAD sealing uses ring.
aes = "0.9"
crc32fast = "1.5"
engine-outbound = { path = "../engine-outbound" }
md-5 = "0.10"
ring = "0.17"
serde = { version = "1", features = ["derive"] }
sha2 = "0.10"
sha3 = "0.10"
tokio = { version = "1", default-features = false, features = ["io-util"] }
transport-grpc = { path = "../transport-grpc" }
transport-tls = { path = "../transport-tls" }
transport-ws = { path = "../transport-ws" }

[dev-dependencies]
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
