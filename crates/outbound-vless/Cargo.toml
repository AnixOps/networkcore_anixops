[package]
name = "outbound-vless"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VLESS outbound with REALITY client authentication and XTLS Vision for the embedded engine."

[dependencies]
engine-outbound = { path = "../engine-outbound" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
tls-mimic = { path = "../tls-mimic" }
tokio = { version = "1", default-features = false, features = ["io-util"] }
transport-grpc = { path = "../transport-grpc" }
transport-tls = { path = "../transport-tls" }
transport-ws = { path = "../transport-ws" }
transport-xhttp = { path = "../transport-xhttp" }

[dev-dependencies]
futures = "0.3"
rcgen = "0.14.8"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
