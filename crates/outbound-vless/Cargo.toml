[package]
name = "outbound-vless"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "VLESS outbound with REALITY client authentication and XTLS Vision for the embedded engine."

[dependencies]
engine-outbound = { path = "../engine-outbound" }
ring = "0.17.14"
serde = { version = "1", features = ["derive"] }
tls-mimic = { path = "../tls-mimic" }
tokio = { version = "1", default-features = false, features = ["io-util"] }

[dev-dependencies]
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "macros", "time"] }

[lib]
path = "src/lib.rs"
