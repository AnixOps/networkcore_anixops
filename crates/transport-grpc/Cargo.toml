[package]
name = "transport-grpc"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "V2Ray-style gRPC (\"gun\") client transport shared by outbound protocol crates."

[dependencies]
bytes = "1"
engine-outbound = { path = "../engine-outbound" }
h2 = "0.4"
http = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "rt"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "rt-multi-thread", "macros", "time"] }

[lib]
path = "src/lib.rs"
