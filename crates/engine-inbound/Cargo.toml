[package]
name = "engine-inbound"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Server inbound interfaces: protocol inbounds, the user table with traffic and online counters, and the serve loop."

[dependencies]
engine-outbound = { path = "../engine-outbound" }
# FuturesUnordered for the sessions of one Mux.Cool connection.
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "rt", "macros"] }

[dev-dependencies]
tokio = { version = "1", default-features = false, features = ["net", "io-util", "time", "sync", "rt", "rt-multi-thread", "macros"] }

[lib]
path = "src/lib.rs"
