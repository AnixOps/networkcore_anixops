[package]
name = "node-import"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Subscription nodes to embedded-engine outbound entries, with a small C ABI the iOS app links instead of the tunnel engine."

[dependencies]
config-core = { path = "../config-core" }
control-domain = { path = "../control-domain" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
crate-type = ["lib", "staticlib"]
