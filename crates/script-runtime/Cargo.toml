[package]
name = "script-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Loon-compatible HTTP script runtime: one Rust $-API host with thin QuickJS (quickjs-ng) and JavaScriptCore bindings."

[features]
default = ["quickjs"]
# Desktop binding (quickjs-ng through rquickjs).
quickjs = ["dep:rquickjs"]
# Apple JavaScriptCore binding through the public C API; ignored on other targets.
javascriptcore = []

[dependencies]
rquickjs = { version = "0.13", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# rquickjs ships no prebuilt bindings for iOS, so they are generated there with
# bindgen (libclang from Xcode; the iOS build scripts set the SDK sysroot).
[target.'cfg(target_os = "ios")'.dependencies]
rquickjs = { version = "0.13", default-features = false, features = ["std", "bindgen"], optional = true }

[lib]
path = "src/lib.rs"
