[package]
name = "script-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Loon-compatible HTTP script runtime: one Rust $-API host with thin QuickJS (quickjs-ng) and JavaScriptCore bindings."

[features]
default = ["quickjs"]
# Desktop binding (quickjs-ng through rquickjs).
quickjs = ["dep:rquickjs"]
# Apple JavaScriptCore binding through the public C API; ignored on other targets.
javascriptcore = []

[dependencies]
rquickjs = { version = "0.13", default-features = false, features = ["std"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lib]
path = "src/lib.rs"
